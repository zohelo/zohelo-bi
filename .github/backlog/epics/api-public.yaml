key: bi/api/public
area: bi/api
title: Public read-only tier, API and embeds
phase: 2
priority: P2
target: 2027-03-13
why: >-
  Journalists and researchers will scrape or copy numbers if there is no API, and zohelo.com needs
  embeddable views. zohelo-bi stays behind sign-in in Phase 1 (decision 6) and opens read-only in
  Phase 2 only after the server-side security audit.
outcome: >-
  Anonymous visitors can browse the catalogue, KPI pages, explorer and dashboards read-only; a
  cached, rate-limited JSON API and an embed endpoint with attribution exist (F10–F15).
in_scope:
  - Public JSON API /api/v1/kpi/<key> with edge cache and rate limit (F13)
  - Embed endpoint /embed?view=… with attribution footer (F12)
  - Compare the same KPI across sources (F10); saved views and watchlist (F11)
  - DuckDB-WASM path for large cuts over published Parquet (F14); PL/EN UI toggle (F15)
  - Access policy change to public read-only for read routes
out_of_scope:
  - Accounts beyond a light e-mail magic link
  - Write features for anonymous users
done_when:
  - "Security audit (Epic bi/platform/security-audit) closed with no open high findings"
  - "bi.zohelo.com read routes answer without sign-in; write routes still require Access"
  - "/api/v1 documented, cached (hit ratio reported), rate-limited per IP"
  - "zohelo.com embeds at least one bi view with attribution"
decisions: ["owner 27 Oct #6: sign-in only at v1; public read-only in Phase 2 after the audit"]
depends_on: [bi/platform/security-audit, bi/dashboards/v1]
deliverables:
  - key: bi/api/public/api-v1
    title: Public JSON API v1
    done_when:
      - "GET /api/v1/kpi/<key>?<filters> returns validated, cached JSON; 429 beyond the rate limit"
    todo:
      - "Versioned routes on the published layer; OpenAPI document at /api/v1/openapi.json"
      - "Rate limit (Cloudflare rate-limiting rule or Worker counter) and cache headers"
  - key: bi/api/public/embeds
    title: Embed endpoint
    done_when:
      - "/embed?view=… renders a chart-only page with source, date and licence footer; iframe-safe headers"
    tasks:
      - key: bi/api/public/embeds/embed-helpers
        type: Task
        title: Add embed filter and footer helpers with tests
        effort: S
        state: open
        context: >-
          The /embed page (Task embed-page) takes the explorer's query parameters (metric, and one parameter
          per filter column with values joined by '|', as apps/portal/src/pages/Explorer.tsx reads them) and
          shows a footer with the sources and the latest period. These two pure helpers hold that logic so it
          is tested in the node test environment.
        files:
          - create: apps/portal/src/embed.ts
          - create: apps/portal/src/embed.test.ts
        steps:
          - "embedFilters(params: URLSearchParams, m: Metric): Filters — for each dimension of m with filter true: params.get(column) split on '|' with empty parts dropped; when params has no 'metric', m.defaults[column] fills a column without a value (as Explorer.tsx does). Filters from ./api; Metric from @zohelo/semantic."
          - "embedFooter(rows: SeriesRow[]): {sources: string[]; latest: string | null} — distinct source_system in first-seen order mapped through SOURCES from ./labels (unknown → the key); latest = greatest date_key among rows whose value is not null, else null."
          - "embed.test.ts: the population metric of the manifest and hand-written SeriesRow rows."
        acceptance:
          - "embedFilters(new URLSearchParams('metric=population&geography_name=Polska|Śląskie'), population) gives {geography_name: ['Polska', 'Śląskie']} and no default columns"
          - "embedFilters(new URLSearchParams(''), manifest.metrics[0]) gives that metric's defaults as one-value lists"
          - "embedFooter of rows (eurostat 2020 value 1, world_bank_wdi 2023 value 2, eurostat 2024 value null) gives sources ['Eurostat', 'World Bank'] and latest '2023'"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - The page, App.tsx and headers (Task embed-page)
      - key: bi/api/public/embeds/embed-page
        type: Task
        title: Add the chart-only /embed page with a source footer
        effort: S
        state: open
        depends_on: [bi/api/public/embeds/embed-helpers]
        context: >-
          zohelo.com and others will embed one explorer view in an iframe. apps/portal/src/App.tsx picks the
          page from the path. embedFilters and embedFooter (apps/portal/src/embed.ts) read the parameters and
          build the footer. Cloudflare Pages serves apps/portal/public/_headers with the build. The site stays
          behind Access until Deliverable bi/api/public/open; licence text per source comes later from
          catalog.json.
        files:
          - create: apps/portal/src/pages/Embed.tsx
          - edit: apps/portal/src/App.tsx
          - edit: apps/portal/src/styles.css
          - create: apps/portal/public/_headers
        steps:
          - "Embed.tsx: url = useLocation(); m = metric(url.searchParams.get('metric') ?? '') ?? manifest.metrics[0]; filters = embedFilters(url.searchParams, m); series via useData(JSON.stringify([m.id, filters]), () => api.series(m.id, filters))."
          - "Render <div className=\"embed\">: <h1 className=\"embed-title\">{m.label}</h1>; error → <p className=\"error\">; loading without data → <div className=\"skeleton tall\" />; else <SeriesChart rows chart=\"line\" unit={m.unitLabel} label={m.label} />; then <footer className=\"embed-foot\">Source: {sources.join(', ')} · Latest: {latest ?? '–'} · <a href={`/explore${url.search}`} target=\"_blank\" rel=\"noopener\">Open in zohelo BI</a></footer>."
          - "App.tsx: when the path starts with '/embed' return <Embed /> alone (no topbar, no footer); other paths unchanged."
          - "styles.css, at the end: .embed {padding: 12px; background: var(--bg);} .embed-title {font-size: 1rem; margin: 0 0 8px;} .embed-foot {margin-top: 8px; font-size: 0.8rem; color: var(--muted);}"
          - "public/_headers: one block for /embed and one for /embed/*, each with `Content-Security-Policy: frame-ancestors 'self' https://zohelo.com https://*.zohelo.com`. Nothing for other paths."
        acceptance:
          - "/embed?metric=population shows the title, the chart and the footer, and no topbar"
          - "apps/portal/dist/_headers exists after the build and names frame-ancestors"
        verify:
          - run: bun run lint && bun run check && bun run build && grep -c frame-ancestors apps/portal/dist/_headers
            expect: all pass, then 2
        out_of_scope:
          - The 'Copy embed code' button (Task embed-code)
          - Access policy, licence text, bar or map embeds
      - key: bi/api/public/embeds/embed-code
        type: Task
        title: Add a Copy embed code button to the explorer
        effort: S
        state: open
        depends_on: [bi/api/public/embeds/embed-page]
        context: >-
          /embed (Task embed-page) renders the explorer's current metric and filters as a chart-only page.
          Users copy an iframe snippet for it from the explorer. The snippet must escape the title, since
          metric labels are text.
        files:
          - edit: apps/portal/src/embed.ts
          - edit: apps/portal/src/embed.test.ts
          - edit: apps/portal/src/pages/Explorer.tsx
        steps:
          - "embed.ts: export function embedCode(origin: string, search: string, title: string): string returning exactly `<iframe src=\"${origin}/embed${search}\" title=\"${esc(title)}\" width=\"100%\" height=\"420\" style=\"border:0\" loading=\"lazy\"></iframe>`, where esc replaces & < > \" with &amp; &lt; &gt; &quot; (src is escaped the same way)."
          - "Explorer.tsx, in the Matrix panel header after the XLSX button: <button type=\"button\" className=\"button\">Copy embed code</button>; onClick: navigator.clipboard.writeText(embedCode(window.location.origin, url.search, m.label)) then show <span className=\"hint\">Copied</span> for 2 seconds (useState + setTimeout cleared on unmount); on a rejected promise show 'Copy failed' instead."
        acceptance:
          - "embedCode('https://bi.zohelo.com', '?metric=population&a=1', 'GDP \"x\" & <y>') returns the iframe with src https://bi.zohelo.com/embed?metric=population&amp;a=1 and title GDP &quot;x&quot; &amp; &lt;y&gt;"
          - "the button is next to CSV and XLSX in the Matrix panel"
        verify:
          - run: bun run test && bun run lint && bun run check && bun run build
            expect: all pass
        out_of_scope:
          - Changing the /embed page
          - Embed sizes other than 100% × 420
  - key: bi/api/public/compare-saved
    title: Compare sources, saved views, watchlist
    done_when:
      - "Explorer compares one KPI across sources side by side; views saved and listed per user"
    tasks:
      - key: bi/api/public/compare-saved/saved-views-store
        type: Task
        title: Keep saved explorer views in browser storage (pure module)
        effort: S
        state: open
        context: >-
          F11 starts with saved views kept in the browser (localStorage); accounts come later. Storage can be
          missing or throw (private windows, blocked site data), so every read and write is guarded and the
          functions take the storage as a parameter, which also makes them testable in the node test
          environment.
        files:
          - create: apps/portal/src/savedViews.ts
          - create: apps/portal/src/savedViews.test.ts
        steps:
          - "export type SavedView = {id: string; name: string; url: string; saved_at: string}; export const VIEWS_KEY = 'zohelo-bi.saved-views.v1'; export const MAX_VIEWS = 50; type Store = Pick<Storage, 'getItem' | 'setItem'>."
          - "browserStorage(): Store | null — return window.localStorage inside try/catch; null on error or when window is undefined."
          - "loadViews(store: Store | null): SavedView[] — JSON.parse(getItem(VIEWS_KEY)) in try/catch; keep only array items whose four fields are strings; anything else → []."
          - "saveView(store, input: {name: string; url: string}, now = new Date()): SavedView[] — new view {id: now.getTime().toString(36), name: input.name.trim() or input.url, url, saved_at: now.toISOString()} first, then the loaded views without any of the same url; cut to MAX_VIEWS; setItem in try/catch (a failed write still returns the list); return the list."
          - "removeView(store, id): SavedView[] — loaded views without that id, written back the same way, returned."
          - "savedViews.test.ts: an in-memory store (Map-backed getItem/setItem), a store whose methods throw, and null."
        acceptance:
          - "save two views → newest first; saving the first url again moves it to the top without a duplicate"
          - "51 saves keep 50"
          - "removeView drops only that id"
          - "invalid JSON or a non-array stored value loads as []"
          - "a throwing store and null both give [] on load and do not throw on save or remove"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - Any UI (Task saved-views-ui)
          - Accounts, D1, sync across devices
      - key: bi/api/public/compare-saved/saved-views-ui
        type: Task
        title: Save and list explorer views in the explorer
        effort: S
        state: open
        depends_on: [bi/api/public/compare-saved/saved-views-store]
        context: >-
          apps/portal/src/savedViews.ts (Task saved-views-store) keeps saved views in browser storage. Every
          explorer view lives in its URL, so a saved view is its path and query.
        files:
          - edit: apps/portal/src/pages/Explorer.tsx
          - edit: apps/portal/src/styles.css
        steps:
          - "Explorer.tsx: const store = browserStorage() once (useMemo); const [views, setViews] = useState(() => loadViews(store))."
          - "In .page-head after the lede: <button type=\"button\" className=\"button\">Save view</button>; onClick: setViews(saveView(store, {name: `${m.label} · ${new Date().toISOString().slice(0, 10)}`, url: url.pathname + url.search}))."
          - "After the Rows panel: when views.length > 0, <section className=\"panel saved-views\"><header className=\"panel-head\"><h2>Saved views</h2></header><ul> with one <li> per view: <Link to={v.url}>{v.name}</Link> <span className=\"hint\">{v.saved_at.slice(0, 10)}</span> <button type=\"button\" className=\"button\" aria-label={`Remove ${v.name}`} onClick={() => setViews(removeView(store, v.id))}>Remove</button>. Link from ../router."
          - "styles.css, at the end: .saved-views ul {list-style: none; margin: 0; padding: 0; display: grid; gap: 6px;} .saved-views li {display: flex; gap: 8px; align-items: center;}"
        acceptance:
          - "Save view adds the current URL to the list; reloading the page keeps it; Remove deletes it"
          - "With storage blocked the explorer still renders and Save view does nothing visible"
          - "The Saved views panel is absent when there are no views"
        verify:
          - run: bun run lint && bun run check && bun run build
            expect: all pass
        out_of_scope:
          - Renaming views, a watchlist, accounts
          - Changing savedViews.ts
      - key: bi/api/public/compare-saved/compare-fn
        type: Task
        title: Add a compare-sources table function with tests
        effort: S
        state: open
        contract: false
        context: >-
          F10: one KPI published by several sources (for example population from Eurostat, GUS BDL and
          World Bank) should be readable side by side, period by period, with the gap between the sources.
          Today the explorer only draws every series as its own line. Series rows come from the API as
          SeriesRow (packages/semantic/src/index.ts: series_key, source_system, geography_name, frequency,
          date_key, value, unit, breakdown_json). This Task adds only the pure function; the table component
          is Task compare-table.
        files:
          - create: apps/portal/src/compare.ts
          - create: apps/portal/src/compare.test.ts
        steps:
          - "compare.ts: import type SeriesRow from @zohelo/semantic. Export type CompareRow = {period: string; values: Record<string, number | null>; spread: number | null}; export type CompareTable = {sources: string[]; rows: CompareRow[]}."
          - "export function compareSources(rows: SeriesRow[]): CompareTable — sources = distinct source_system in first-seen order; group rows by date_key; for each period values[source] = the value of the first row of that source and period (null when the source has no row or the value is null); spread = max − min of the non-null values when at least 2 are non-null, else null; rows sorted by period descending (string compare)."
          - "compare.test.ts: hand-written SeriesRow rows (helper row(source, date_key, value) filling the other fields with fixed values)."
        acceptance:
          - "eurostat 2023 = 10, gus_bdl 2023 = 12, eurostat 2022 = 9 → sources ['eurostat', 'gus_bdl']; rows [2023 {eurostat 10, gus_bdl 12} spread 2, 2022 {eurostat 9, gus_bdl null} spread null]"
          - "a row with value null counts as missing: eurostat 2023 null, gus_bdl 2023 5 → spread null"
          - "two rows of the same source and period keep the first value"
          - "an empty input gives {sources: [], rows: []}"
        verify:
          - run: bun install --frozen-lockfile && bun run lint && bun run check && bun run test
            expect: all pass
        out_of_scope:
          - The table component and any change to Explorer.tsx (Task compare-table)
          - Unit conversion between sources (rows of different units are compared as they are)
      - key: bi/api/public/compare-saved/compare-table
        type: Task
        title: Add a CompareTable component for sources side by side
        effort: S
        state: open
        contract: false
        depends_on: [bi/api/public/compare-saved/compare-fn]
        context: >-
          Renders the result of compareSources (apps/portal/src/compare.ts, Task compare-fn) as a table:
          one column per source with its display name, one row per period, and a Spread column. Source
          names come from SOURCES via display('source_system', key) in apps/portal/src/labels.ts and numbers
          from formatNumber in the same file. The component is not yet placed in the explorer: Explorer.tsx
          has several open PRs, so the wiring is a later Task.
        files:
          - create: apps/portal/src/components/CompareTable.tsx
          - create: apps/portal/src/components/CompareTable.test.tsx
          - edit: apps/portal/src/styles.css
        steps:
          - "CompareTable.tsx: export function CompareTable({table}: {table: CompareTable}) (import the type from ../compare). When table.sources.length < 2 render <p className=\"compare-empty\">Only one source publishes this KPI.</p>."
          - "Otherwise render <table className=\"compare-table\"> with <thead>: Period, then display('source_system', s) for each source, then Spread; <tbody>: one <tr> per row with the period, formatNumber(values[s]) per source and formatNumber(spread); number cells have className \"num\"."
          - "styles.css, at the end: .compare-empty {color: var(--muted);} .compare-table {border-collapse: collapse; width: 100%;} .compare-table th, .compare-table td {padding: 4px 8px; border-bottom: 1px solid var(--border);} .compare-table .num {text-align: right; font-variant-numeric: tabular-nums;}"
          - "CompareTable.test.tsx: renderToStaticMarkup (react-dom/server), as in KpiCard.test.tsx."
        acceptance:
          - "a table of sources ['eurostat', 'gus_bdl'] renders headers Period, Eurostat, GUS BDL, Spread"
          - "a null value renders '–' (formatNumber)"
          - "a table with one source renders the 'Only one source publishes this KPI.' message and no <table>"
        verify:
          - run: bun install --frozen-lockfile && bun run lint && bun run check && bun run test
            expect: all pass
        out_of_scope:
          - Placing the component in Explorer.tsx or a compare toggle in the URL (later Task)
          - Changing compare.ts or labels.ts
      - key: bi/api/public/compare-saved/compare-texts
        type: Task
        title: Translate the CompareTable and FreshnessBadge texts (PL/EN)
        effort: S
        state: open
        contract: false
        context: >-
          apps/portal/src/components/CompareTable.tsx ("Period", "Spread", "Only one source publishes this KPI.")
          and FreshnessBadge.tsx ("to <period>", "no data", title "loaded <date>") have fixed English texts. No
          page renders them yet. This Task adds a lang prop that defaults to "en", as ShelfPanel.tsx does.
        files:
          - edit: apps/portal/src/components/CompareTable.tsx
          - edit: apps/portal/src/components/CompareTable.test.tsx
          - edit: apps/portal/src/components/FreshnessBadge.tsx
          - edit: apps/portal/src/components/FreshnessBadge.test.tsx
          - edit: apps/portal/src/i18n.ts
        steps:
          - "i18n.ts: add in STRINGS.en directly after the line \"table.showing\" and in STRINGS.pl directly after its \"table.showing\" line (nowhere else): compare.period 'Period' / 'Okres'; compare.spread 'Spread' / 'Rozpiętość'; compare.oneSource 'Only one source publishes this KPI.' / 'Ten wskaźnik publikuje tylko jedno źródło.'; fresh.to 'to {period}' / 'do {period}'; fresh.noData 'no data' / 'brak danych'; fresh.loaded 'loaded {date}' / 'wczytano {date}'."
          - "CompareTable.tsx: props get lang?: Lang (default \"en\"; import type Lang and t from ../i18n); render the three texts with t()."
          - "FreshnessBadge.tsx: the same prop; text t(lang, \"fresh.to\").replace(\"{period}\", f.lastPeriod) or t(lang, \"fresh.noData\"); title t(lang, \"fresh.loaded\").replace(\"{date}\", f.loadedDate) when loadedDate is set."
          - "Both test files: existing cases unchanged; add one lang=\"pl\" case each."
        acceptance:
          - "CompareTable lang=\"pl\" → '<th>Okres</th>' and 'Rozpiętość'; one source → 'Ten wskaźnik publikuje tylko jedno źródło.'"
          - "FreshnessBadge lang=\"pl\" → 'do 2025' and title=\"wczytano 2026-01-01\"; lastPeriod null → 'brak danych'"
          - "without lang both render exactly as today"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
        out_of_scope:
          - Source names (labels.ts) and number formats
          - Placing either component on a page
      - key: bi/api/public/compare-saved/compare-toggle
        type: Task
        title: Add a Compare sources toggle to the explorer
        effort: S
        state: open
        contract: false
        depends_on: [bi/api/public/compare-saved/compare-texts]
        context: >-
          compareSources() (apps/portal/src/compare.ts) and CompareTable exist but no page uses them. F10: with
          ?compare=1 the explorer shows the current rows source by source, period by period. compareSources keeps the
          first row per source and period, so the panel asks for one area.
        files:
          - edit: apps/portal/src/pages/Explorer.tsx
          - edit: apps/portal/src/i18n.ts
        steps:
          - "i18n.ts: add in STRINGS.en directly after the line \"explorer.downloadCsv\" and in STRINGS.pl directly after its \"explorer.downloadCsv\" line (nowhere else): explorer.compare 'Compare sources' / 'Porównaj źródła'; explorer.compareHint 'One value per source and period: pick one area to compare like with like.' / 'Jedna wartość na źródło i okres: wybierz jeden obszar, aby porównać to samo.'"
          - "Explorer.tsx: compare = url.searchParams.get(\"compare\") === \"1\"; compared = useMemo(() => compareSources(rows), [rows]); add \"compare\" to the params go() keeps."
          - "toggleCompare(): p = new URLSearchParams(url.searchParams); compare on → p.delete(\"compare\"), else p.set(\"compare\", \"1\"); navigate(`/explore?${p}`)."
          - "page-head, after the Save view button: <button type=\"button\" className=\"button\" aria-pressed={compare} onClick={toggleCompare}>{t(lang, \"explorer.compare\")}</button>."
          - "Directly after the matrix <section>, when compare: <section className=\"panel\"> with <header className=\"panel-head\"><h2>{t(lang, \"explorer.compare\")}</h2></header>, <p className=\"hint\">{t(lang, \"explorer.compareHint\")}</p> and <div className=\"table-wrap\"><CompareTable table={compared} lang={lang} /></div>."
        acceptance:
          - "/explore?metric=population&geography_name=Polska&compare=1 shows one column per source and the button has aria-pressed=\"true\"; pressing it removes compare from the URL"
          - "changing a filter keeps compare=1; without compare the page is unchanged"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check && bun run build
            expect: all pass
          - workflow: Check on the PR
            expect: smoke passed
        out_of_scope:
          - compare.ts, CompareTable.tsx; unit conversion between sources
          - The view-tabs tablist (Bug zohelo-bi#276)
    todo:
      - "Watchlist, then e-mail magic-link account with D1 (F11)"
  - key: bi/api/public/large-cuts
    title: Large cuts and language toggle
    done_when:
      - "Cuts over the R2 SQL row cap load via DuckDB-WASM from published Parquet; UI toggles PL/EN"
    todo:
      - "DuckDB-WASM loader over kpi/<key>/series.parquet (F14)"
    tasks:
      - key: bi/api/public/large-cuts/i18n-strings
        type: Task
        title: Add PL and EN UI string dictionaries with a lookup function
        effort: S
        state: open
        contract: false
        context: >-
          F15: the portal is English only today. Its fixed texts are in apps/portal/src/App.tsx (nav labels
          Dashboard, Explorer, Catalogue; the PoC data badge and its title; the footer) and in labels.ts
          (FREQUENCIES, GEO_LABELS). The published catalogue already carries name_pl and name_en for KPIs,
          domains and sources. This Task adds a pure module with both dictionaries, a lookup and a name
          picker; later Tasks add the language state and the toggle.
        files:
          - create: apps/portal/src/i18n.ts
          - create: apps/portal/src/i18n.test.ts
        steps:
          - "i18n.ts: export type Lang = 'pl' | 'en'; export const LANGS: Lang[] = ['pl', 'en']."
          - "export const STRINGS = {en: {...}, pl: {...}} as const with exactly these keys and texts (en / pl): nav.dashboard Dashboard / Pulpit; nav.explorer Explorer / Eksplorator; nav.catalogue Catalogue / Katalog; badge.poc PoC data / Dane PoC; badge.pocTitle 'Built on the Gold proof of concept: small real samples' / 'Na podstawie prototypu warstwy Gold: małe próbki prawdziwych danych'; footer.data 'Data: Eurostat, GUS, World Bank, NBP via' / 'Dane: Eurostat, GUS, Bank Światowy, NBP przez'; lang.switch 'Polski' / 'English'; freq.A Annual / Roczne; freq.Q Quarterly / Kwartalne; freq.M Monthly / Miesięczne; freq.D Daily / Dzienne. export type StringKey = keyof typeof STRINGS.en."
          - "export function t(lang: Lang, key: StringKey): string — STRINGS[lang][key], falling back to STRINGS.en[key]."
          - "export function pickName(lang: Lang, item: {name_pl?: string | null; name_en?: string | null}): string — the name of lang when non-empty, else the other one, else ''."
          - "export function parseLang(value: string | null | undefined): Lang | null — 'pl' or 'en' (case-insensitive, trimmed), else null."
          - "i18n.test.ts: every key of STRINGS.en exists in STRINGS.pl with a non-empty text, and the other way round."
        acceptance:
          - "t('pl', 'nav.catalogue') is 'Katalog' and t('en', 'nav.catalogue') is 'Catalogue'"
          - "pickName('pl', {name_pl: '', name_en: 'Population'}) is 'Population'; pickName('en', {}) is ''"
          - "parseLang(' PL ') is 'pl'; parseLang('de') and parseLang(null) are null"
          - "the dictionary test passes"
        verify:
          - run: bun install --frozen-lockfile && bun run lint && bun run check && bun run test
            expect: all pass
        out_of_scope:
          - Using the strings in App.tsx or any page (Task lang-toggle and later Tasks)
          - Changing labels.ts
      - key: bi/api/public/large-cuts/lang-state
        type: Task
        title: Keep the chosen UI language in the URL and browser storage
        effort: S
        state: open
        contract: false
        depends_on: [bi/api/public/large-cuts/i18n-strings]
        context: >-
          The portal needs one current language: from ?lang= in the URL first, then the viewer's last choice
          in localStorage, then the browser language (pl* gives pl), else en. Storage can be missing or throw,
          so, as in apps/portal/src/savedViews.ts, the functions take the storage as a parameter and every
          access is guarded. A small hook reads it for components; the toggle is Task lang-toggle.
        files:
          - create: apps/portal/src/lang.ts
          - create: apps/portal/src/lang.test.ts
        steps:
          - "lang.ts: import {parseLang, type Lang} from ./i18n and browserStorage from ./savedViews. export const LANG_KEY = 'zohelo-bi.lang.v1'."
          - "export function resolveLang(search: URLSearchParams, store: Pick<Storage, 'getItem'> | null, navigatorLanguage: string | undefined): Lang — parseLang(search.get('lang')) ?? (stored value via try { parseLang(store?.getItem(LANG_KEY)) } catch → null) ?? (navigatorLanguage?.toLowerCase().startsWith('pl') ? 'pl' : 'en')."
          - "export function saveLang(store: Pick<Storage, 'setItem'> | null, lang: Lang): void — store?.setItem(LANG_KEY, lang) inside try/catch (errors ignored)."
          - "export function useLang(): [Lang, (l: Lang) => void] — useState initialised with resolveLang(new URL(window.location.href).searchParams, browserStorage(), navigator.language); the setter calls saveLang(browserStorage(), l), sets document.documentElement.lang = l and updates the state; a useEffect sets document.documentElement.lang on mount."
          - "lang.test.ts: tests for resolveLang and saveLang only, with a Map-backed fake storage and one whose getItem/setItem throw."
        acceptance:
          - "?lang=en wins over a stored 'pl' and a navigator 'pl-PL'"
          - "no ?lang and stored 'pl' gives 'pl'; a storage that throws falls through to the navigator language"
          - "navigator 'pl-PL' gives 'pl'; navigator 'de-DE' or undefined gives 'en'"
          - "saveLang with a throwing storage does not throw"
        verify:
          - run: bun install --frozen-lockfile && bun run lint && bun run check && bun run test
            expect: all pass
        out_of_scope:
          - The toggle button and any change to App.tsx (Task lang-toggle)
          - Changing savedViews.ts or i18n.ts
