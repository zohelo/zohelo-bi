key: bi/dashboards/v1
area: bi/dashboards
title: Dashboard YAML v2 and five domain dashboards
phase: 1
priority: P1
target: 2027-01-23
why: >-
  Most visitors will not build a view; they open a ready dashboard on a topic. Today there is one
  sample dashboard. Five topic dashboards on real KPIs are the v1 promise, and the YAML format must
  carry domains, global slicers and references to explorer views so tiles stay consistent.
outcome: >-
  Five dashboards (Poland overview, Labour market, Prices & money, Population, Regional comparison)
  declared in Dashboard YAML v2, validated in CI against the published catalogue and smoke-tested
  tile by tile on every deploy (F8).
in_scope:
  - Dashboard YAML v2 schema and validator (domain, kpi_key, global slicers, tile → view)
  - Migration of overview.yaml to v2
  - The five dashboards, PL/EN titles, freshness per tile, "Open in explorer" on every tile
out_of_scope:
  - Public finance, housing and portfolio dashboards (later, as sources land / Phase 2)
  - User-built dashboards
done_when:
  - "dashboards/ holds 5 v2 files; ops/check-dashboards.ts validates them against catalog.json in CI"
  - "Deploy smoke checks every tile of every dashboard and passes"
  - "Every tile opens the same view in the explorer"
depends_on: [bi/platform/hardening, bi/platform/published-loader]
deliverables:
  - key: bi/dashboards/v1/schema-v2
    title: Dashboard YAML v2 schema and validator
    depends_on: [bi/platform/quality/api-tests]
    done_when:
      - "validateDashboard accepts v2 files (schema: 2) and v1 files during the migration; tests for both"
    tasks:
      - key: bi/dashboards/v1/schema-v2/doc
        type: Task
        title: Document Dashboard YAML v2 in docs/dashboards.md
        effort: S
        state: open
        context: >-
          Dashboards are YAML in dashboards/ (today v1: id, title, description, tiles of {title, note?,
          metric, chart: line|bar, selects?, filters}); the format lives only in a comment of
          dashboards/overview.yaml and in README "Adding a dashboard". v2 is the contract the validator,
          the smoke test and the five domain dashboards are built against, so it is written down first.
        files:
          - create: docs/dashboards.md
          - edit: README.md
        steps:
          - "docs/dashboards.md, section 'Version 1 (today)': the fields above with one line each, as read by apps/portal/src/dashboards.ts."
          - "Section 'Version 2': a table field | type | required | meaning with exactly these rows: schema (2, required); id (kebab-case, = file name, required); title_pl, title_en (string, required); description_pl, description_en (string, optional); domain_key (a domain key of catalog.json, required); slicers (list of 'geography' and/or 'period', optional, default none); tiles (list, required, 1–12)."
          - "Tile table: title_pl, title_en (required); kpi_key (a KPI key of catalog.json, required); view (explorer URL query without '?', e.g. 'rows=geo&cols=time&geo_level=voivodeship', required); chart (line | bar | multiples | ranking | map, required); selects (boolean, optional, as in v1); note_pl, note_en (optional)."
          - "Section 'Rules': slicer values override the same parameter in every tile's view; '$selected' keeps its v1 meaning; a v1 file has no schema field and stays valid until the five-dashboards Deliverable migrates it."
          - "A complete v2 example of one dashboard with two tiles (population line, unemployment ranking) in a yaml code block."
          - "README.md 'Adding a dashboard': add 'Format: docs/dashboards.md.'"
        acceptance:
          - "docs/dashboards.md has the sections Version 1 (today), Version 2, Rules and an example"
          - "the example parses with the yaml package and has schema: 2"
        verify:
          - run: "bun -e \"const t=await Bun.file('docs/dashboards.md').text();const y=t.split('```yaml')[1].split('```')[0];console.log(require('yaml').parse(y).schema)\""
            expect: "2"
          - run: bun install --frozen-lockfile && bun run check
            expect: exit 0
        out_of_scope:
          - validator and code changes (next Tasks)
          - migrating overview.yaml
      - key: bi/dashboards/v1/schema-v2/validator
        type: Task
        title: Validate Dashboard YAML v2 files next to v1
        effort: M
        state: open
        depends_on: [bi/dashboards/v1/schema-v2/doc]
        context: >-
          packages/semantic/src/dashboards.ts validateDashboard(d, file) checks v1 files only. docs/dashboards.md
          defines v2. catalog.json is not published yet, so this Task checks structure only; kpi_key and
          domain_key against the catalogue come later. The portal and ops/check-dashboards.ts both call
          validateDashboard, so both accept v2 once it does.
        files:
          - edit: packages/semantic/src/dashboards.ts
          - edit: packages/semantic/src/dashboards.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "Add types TileV2 {title_pl; title_en; kpi_key; view: string; chart: 'line' | 'bar' | 'multiples' | 'ranking' | 'map'; selects?: boolean; note_pl?; note_en?} and DashboardV2 {schema: 2; id; title_pl; title_en; description_pl?; description_en?; domain_key; slicers?: ('geography' | 'period')[]; tiles: TileV2[]} (strings unless stated); export both from index.ts."
          - "validateDashboard: schema === 2 → v2 rules; schema absent → today's v1 rules unchanged; any other value → `${file}: unsupported schema <value>`."
          - "v2 rules (each message prefixed `${file}: `): id matches /^[a-z0-9]+(-[a-z0-9]+)*$/ ('id must be kebab-case'); when file ends in .yaml, id equals its base name without .yaml ('id must equal the file name'); title_pl, title_en, domain_key non-empty ('needs <field>'); slicers items are 'geography' or 'period' ('unknown slicer <x>'); tiles has 1–12 items ('needs 1–12 tiles')."
          - "v2 tile rules (prefix `${file}: tile <n>: `, n from 1): title_pl, title_en, kpi_key non-empty; kpi_key matches /^[a-z0-9_]+$/; view does not start with '?' and new URLSearchParams(view) has a key; chart is one of the five; selects, if present, is boolean."
          - "Tests: the yaml example from docs/dashboards.md (read with node:fs) is valid as validateDashboard(example, 'dashboards/population-labour.yaml'); v1 still valid; schema 3 rejected; bad id; id ≠ file name; unknown slicer; 0 and 13 tiles; chart 'pie'; view starting with '?'; missing kpi_key — each gives its message."
        acceptance:
          - "≥ 10 v2 cases pass; existing v1 tests pass unchanged"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
          - run: bun ops/check-dashboards.ts
            expect: dashboards ok
        out_of_scope:
          - "kpi_key, domain_key or view keys against catalog.json (needs data/metadata/catalogue-v1)"
          - "Rendering v2 dashboards; migrating overview.yaml"
      - key: bi/dashboards/v1/schema-v2/tile-queries
        type: Task
        title: Make tile-queries.ts list v2 tiles for the smoke test
        effort: S
        state: open
        depends_on: [bi/dashboards/v1/schema-v2/validator]
        context: >-
          ops/tile-queries.ts prints 'title<TAB>api path' for every v1 tile (metric + filters); ops/smoke.sh
          requests each path. A v2 tile has title_en, kpi_key and view instead. Until the API serves KPIs,
          a v2 tile is listed only when kpi_key is a metric id of today's manifest; its view params pass
          through as filters. Other v2 tiles are skipped with a stderr line so the smoke test does not fail.
        files:
          - edit: ops/tile-queries.ts
        steps:
          - "Type the parsed file as {schema?: number; tiles: unknown[]}. Without schema keep today's v1 code path exactly."
          - "schema 2: per tile {title_en, kpi_key, view}: if metric(kpi_key) from @zohelo/semantic is undefined, console.error(`skip ${title_en}: ${kpi_key} not in the manifest`) and continue. Else p = new URLSearchParams(view); delete rows, cols, t and view from p; replace '$selected' values by the sample as v1 does; print `${title_en.replace('$selected', sample)}\\t/api/metrics/${kpi_key}/series?${p}`."
          - "Commit no v2 file to dashboards/; test with a temporary file as in Verify."
        acceptance:
          - "With only overview.yaml, the output is identical to before"
          - "A v2 tile population with view geography_level=country&rows=date_key prints /api/metrics/population/series?geography_level=country"
        verify:
          - run: "bun ops/tile-queries.ts > /tmp/after.txt && git stash && bun ops/tile-queries.ts > /tmp/before.txt && git stash pop && diff /tmp/before.txt /tmp/after.txt"
            expect: no difference
          - run: "printf 'schema: 2\\nid: t\\ntitle_pl: T\\ntitle_en: T\\ndomain_key: d\\ntiles:\\n  - {title_pl: P, title_en: P, kpi_key: population, view: geography_level=country&rows=date_key, chart: line}\\n  - {title_pl: X, title_en: X, kpi_key: wages, view: rows=geo, chart: bar}\\n' > dashboards/t.yaml && bun ops/tile-queries.ts; rm dashboards/t.yaml"
            expect: "P<TAB>/api/metrics/population/series?geography_level=country on stdout; 'skip X: wages not in the manifest' on stderr"
        out_of_scope:
          - "Changing ops/smoke.sh; committing any v2 dashboard file"
    todo:
      - "Validate kpi_key, domain_key and view keys of v2 files against catalog.json fixtures (depends_on data/metadata/catalogue-v1)"
  - key: bi/dashboards/v1/global-slicers
    title: Global slicers and tile links
    depends_on: [bi/dashboards/v1/schema-v2]
    done_when:
      - "Geography and period slicers apply to every tile; each tile has 'Open in explorer'"
    tasks:
      - key: bi/dashboards/v1/global-slicers/slicer-fns
        type: Task
        title: Add slicer URL state and tile filter merging (pure functions)
        effort: M
        state: open
        depends_on: [bi/dashboards/v1/schema-v2/validator]
        context: >-
          A v2 dashboard (docs/dashboards.md) may declare slicers; a slicer value overrides the same
          parameter in every tile's view. Architect decision (28 Oct): geography sets geography_name, period
          sets period (the column names the API filters on today).
        files:
          - create: packages/semantic/src/slicers.ts
          - create: packages/semantic/src/slicers.test.ts
          - edit: packages/semantic/src/index.ts
          - edit: docs/dashboards.md
        steps:
          - "slicers.ts: export type Slicer = 'geography' | 'period'; export const SLICER_PARAMS: Record<Slicer, string> = {geography: 'geography_name', period: 'period'}; export type SlicerValues = Partial<Record<Slicer, string>>; const ORDER: Slicer[] = ['geography', 'period']; export const LAYOUT_PARAMS = ['rows', 'cols', 't', 'base', 'view', 'metric']."
          - "parseSlicers(params: URLSearchParams, slicers: Slicer[]): SlicerValues = non-empty params.get(SLICER_PARAMS[s]) per declared slicer. slicerParams(values): URLSearchParams of the set values in ORDER. tileView(view: string, values): new URLSearchParams(view), then p.set(SLICER_PARAMS[s], v) per set value in ORDER."
          - "tileFilters(view, values, selected: string | null): Record<string, string[]> | null: tileView entries minus LAYOUT_PARAMS, values split on '|' without empties; '$selected' → selected, or return null when selected is null; drop keys without values."
          - "index.ts: export all of slicers.ts between the './search' and './transform-matrix' lines."
          - "docs/dashboards.md, Rules, second bullet: 'Slicer parameters: geography sets geography_name, period sets period; rows, cols, t, base, view and metric are layout, never filters.'"
        acceptance:
          - "tests: 'geography_name=MAZOWIECKIE&period=2024' with ['geography'] → {geography: 'MAZOWIECKIE'}; slicerParams({period: '2024', geography: 'Polska'}) → 'geography_name=Polska&period=2024'"
          - "tests: tileView('geography_level=country&geography_name=Polska', {geography: 'Czechia'}).toString() = 'geography_level=country&geography_name=Czechia'"
          - "tests: tileFilters('rows=date_key&geography_level=wojewodztwo&geography_name=$selected', {}, null) = null; with 'MAZOWIECKIE' → {geography_level: ['wojewodztwo'], geography_name: ['MAZOWIECKIE']}; 'geography_name=Polska|Germany' → {geography_name: ['Polska', 'Germany']}"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
        out_of_scope:
          - Components, pages, explorer links; validateDashboard
      - key: bi/dashboards/v1/global-slicers/explore-href
        type: Task
        title: Build a v2 tile's explorer link from its view and the slicers
        effort: S
        state: open
        depends_on: [bi/dashboards/v1/global-slicers/slicer-fns]
        context: >-
          Every v2 tile has 'Explore →' opening the same view in the explorer: /explore?metric=<kpi_key>
          followed by the tile's view merged with the slicer values (tileView in
          packages/semantic/src/slicers.ts). The explorer reads metric, its filter columns, rows, cols, t and
          base from the URL.
        files:
          - edit: packages/semantic/src/slicers.ts
          - edit: packages/semantic/src/slicers.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "slicers.ts: export function tileExploreHref(tile: {kpi_key: string; view: string}, values: SlicerValues, selected: string | null): string."
          - "q = new URLSearchParams({metric: tile.kpi_key}); for each [k, v] of tileView(tile.view, values) except k === 'metric': q.append(k, selected === null ? v : v.split('|').map((x) => (x === '$selected' ? selected : x)).join('|')); return `/explore?${q}`."
          - "index.ts: add tileExploreHref to the './slicers' export."
        acceptance:
          - "tests: ({kpi_key: 'population', view: 'geography_level=country&rows=date_key'}, {geography: 'Polska'}, null) → '/explore?metric=population&geography_level=country&rows=date_key&geography_name=Polska'"
          - "tests: view 'geography_level=wojewodztwo&geography_name=$selected' with selected 'MAZOWIECKIE' → '/explore?metric=population&geography_level=wojewodztwo&geography_name=MAZOWIECKIE'; a 'metric=x' in the view is dropped"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
        out_of_scope:
          - Explorer.tsx and Dashboard.tsx
      - key: bi/dashboards/v1/global-slicers/v2-loader
        type: Task
        title: Load v2 dashboard files in the portal next to v1
        effort: S
        state: open
        depends_on: [bi/dashboards/v1/schema-v2/validator]
        context: >-
          apps/portal/src/dashboards.ts bundles dashboards/*.yaml, validates each with validateDashboard and
          casts every file to the v1 Dashboard type, so a valid v2 file (schema: 2) would reach Dashboard.tsx
          and crash it (no metric, no filters). This Task splits the two versions; v2 dashboards are exported
          but not rendered yet.
        files:
          - edit: apps/portal/src/dashboards.ts
          - create: apps/portal/src/dashboards.test.ts
        steps:
          - "Export function splitDashboards(entries: [string, string][]): {v1: Dashboard[]; v2: DashboardV2[]}: per [file, text], d = parse(text) as unknown; problems = validateDashboard(d, file); problems → throw new Error(problems.join('; ')); (d as {schema?: unknown}).schema === 2 → v2, else v1."
          - "Sort v1 exactly as today (overview first, then title); sort v2 with id 'poland-overview' first, then title_en (localeCompare)."
          - "export const {v1: dashboards, v2: dashboardsV2} = splitDashboards(Object.entries(files)); also re-export the types DashboardV2 and TileV2 from @zohelo/semantic next to Dashboard and Tile."
          - "dashboards.test.ts: inline yaml strings: a v1 board (id x, one population line tile), the v2 example of docs/dashboards.md with id b-board / title_en 'Alpha', and a v2 'poland-overview' with title_en 'Zeta'."
        acceptance:
          - "tests: the three entries split into 1 v1 and 2 v2, v2 order poland-overview then b-board; a v2 file with tiles [] throws an error containing 'needs 1–12 tiles'; dashboards (the real files) has ids ['overview'] and dashboardsV2 is []"
          - "App.tsx and Dashboard.tsx unchanged"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
          - run: bun run build
            expect: exit 0
        out_of_scope:
          - Rendering v2 dashboards; adding a v2 file to dashboards/
      - key: bi/dashboards/v1/global-slicers/slicer-bar
        type: Task
        title: Add the SlicerBar component with tests
        effort: S
        state: open
        depends_on: [bi/dashboards/v1/global-slicers/slicer-fns]
        context: >-
          A v2 dashboard shows one picker per declared slicer above its tiles. Values come from
          packages/semantic/src/slicers.ts (types Slicer, SlicerValues); the page supplies the options.
          This Task adds the presentational bar; the v2 page wires it later.
        files:
          - create: apps/portal/src/components/SlicerBar.tsx
          - create: apps/portal/src/components/SlicerBar.test.tsx
        steps:
          - "Export function SlicerBar({slicers, options, values, onChange}: {slicers: Slicer[]; options: Partial<Record<Slicer, {value: string; label: string}[]>>; values: SlicerValues; onChange: (next: SlicerValues) => void}); const LABELS: Record<Slicer, string> = {geography: 'Area', period: 'Period'}."
          - "shown = slicers with a non-empty options list; none → return null."
          - "Render <div className=\"filters slicer-bar\"> with, per shown slicer, <label className=\"check\">{LABELS[s]} <select aria-label={LABELS[s]} value={values[s] ?? ''} onChange={(e) => onChange({...values, [s]: e.target.value || undefined})}> holding <option value=\"\">All</option> and one <option> per option (value, label)</select></label>."
        acceptance:
          - "tests (renderToStaticMarkup): geography with options MAZOWIECKIE/Mazowieckie and Polska/Polska, value MAZOWIECKIE → 'Area', 'All', 'Mazowieckie' and '<option value=\"MAZOWIECKIE\" selected=\"\">'; slicers [] → ''; period without options → no 'Period'"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
        out_of_scope:
          - Fetching options; URL handling; Dashboard.tsx
      - key: bi/dashboards/v1/global-slicers/v2-page
        type: Task
        title: Render v2 dashboards with tiles that link to the explorer
        effort: M
        state: open
        depends_on:
          - bi/dashboards/v1/global-slicers/explore-href
          - bi/dashboards/v1/global-slicers/v2-loader
          - bi/catalogue/kpi-page/page/not-found
        context: >-
          No page renders dashboardsV2 (apps/portal/src/dashboards.ts). Until the published loader a v2 tile
          draws only when kpi_key is a manifest metric and chart is line or bar. UI text is English.
        files:
          - create: apps/portal/src/pages/DashboardV2.tsx
          - create: apps/portal/src/pages/DashboardV2.test.tsx
          - edit: apps/portal/src/App.tsx
        steps:
          - "Export TileV2View({tile, values, selected, onSelect}: {tile: TileV2; values: SlicerValues; selected: string | null; onSelect: (v: string) => void}): m = metric(kpi_key); chart = line or bar, else null; filters = tileFilters(view, values, selected); data = useData(m && chart && filters ? JSON.stringify([kpi_key, filters]) : null, () => api.series(kpi_key, filters!)); title = title_en with '$selected' → display('geography_name', selected), or '…'."
          - "Copy TileView (pages/Dashboard.tsx): its selects effect, and its markup with the Link to tileExploreHref(tile, values, selected) and note_en; body: no m → <p className=\"empty\">{kpi_key} is not served by the API yet.</p>; no chart → <p className=\"empty\">The {tile.chart} chart is not available yet.</p>; else as TileView."
          - "Export DashboardV2Page({dashboard}): url = useLocation(); values = parseSlicers(url.searchParams, dashboard.slicers ?? []); otherwise as Dashboard with title_en and description_en."
          - "App.tsx: pageFor(url.pathname, [...dashboards, ...dashboardsV2].map((d) => d.id)); after the v1 branch, <DashboardV2Page key={id} dashboard={boardV2} /> for a dashboardsV2 id; then NotFound."
        acceptance:
          - "tests (renderToStaticMarkup, values {}, selected null): population line tile, view 'geography_level=country&rows=date_key' → class=\"skeleton\" and href=\"/explore?metric=population&amp;geography_level=country&amp;rows=date_key\"; kpi_key wages → 'wages is not served by the API yet.'; chart map → 'The map chart is not available yet.'; '$selected: x' with MAZOWIECKIE → 'Mazowieckie: x'"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
          - run: "printf 'schema: 2\\nid: t\\ntitle_pl: T\\ntitle_en: T\\ndomain_key: economy\\ntiles:\\n  - {title_pl: P, title_en: P, kpi_key: population, view: geography_level=country, chart: line}\\n' > dashboards/t.yaml && bun ops/check-dashboards.ts && bun run build; rm dashboards/t.yaml"
            expect: dashboards ok, build exit 0
        out_of_scope:
          - Slicer bar; multiples, ranking, map; committing a v2 file
      - key: bi/dashboards/v1/global-slicers/slicer-wiring
        type: Task
        title: Show the geography slicer on v2 dashboards
        effort: S
        state: open
        depends_on: [bi/dashboards/v1/global-slicers/v2-page, bi/dashboards/v1/global-slicers/slicer-bar]
        context: >-
          DashboardV2Page (apps/portal/src/pages/DashboardV2.tsx) reads slicer values from the URL but shows
          no picker. Geography options come from /api/metrics/<id>/members (values.geography_name). The API
          has no period filter yet, so the period slicer gets no options and SlicerBar hides it.
        files:
          - edit: apps/portal/src/pages/DashboardV2.tsx
          - edit: apps/portal/src/pages/DashboardV2.test.tsx
        steps:
          - "Export function geographyOptions(values: string[]): {value: string; label: string}[]: label = display('geography_name', v); sorted by label (localeCompare 'pl')."
          - "DashboardV2Page: source = (dashboard.slicers ?? []).includes('geography') ? dashboard.tiles.map((t) => t.kpi_key).find((k) => metric(k)) : undefined; members = useData(source ? `members:${source}` : null, () => api.members(source!))."
          - "Above the grid: <SlicerBar slicers={dashboard.slicers ?? []} options={{geography: geographyOptions(members.data?.values.geography_name ?? [])}} values={values} onChange={(next) => navigate(`${url.pathname}?${slicerParams(next)}`)} /> (navigate from ../router; keep url from useLocation())."
        acceptance:
          - "tests: geographyOptions(['Polska', 'MAZOWIECKIE']) = [{value: 'MAZOWIECKIE', label: 'Mazowieckie'}, {value: 'Polska', label: 'Polska'}]; the TileV2View tests still pass"
          - "A dashboard without slicers renders no slicer bar and requests no members"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
          - run: bun run build
            expect: exit 0
        out_of_scope:
          - A period slicer control; slicers on v1 dashboards
    todo:
      - "Period slicer options once the API or the published series filter by period (depends_on bi/platform/published-loader/switch)"
      - "Freshness badge per tile from catalog.json freshness"
  - key: bi/dashboards/v1/five-dashboards
    title: Five domain dashboards
    depends_on: [bi/dashboards/v1/global-slicers]
    done_when:
      - "poland-overview, labour-market, prices-money, population, regional-comparison are live and pass smoke"
    tasks:
      - key: bi/dashboards/v1/five-dashboards/poland-overview
        type: Task
        title: Migrate overview.yaml to the v2 file poland-overview.yaml
        effort: M
        state: open
        depends_on: [bi/dashboards/v1/global-slicers/v2-page, bi/dashboards/v1/schema-v2/tile-queries]
        context: >-
          overview.yaml is the last v1 dashboard; portal and smoke test read v2. domain_key economy
          (architect: the overview spans domains). No slicers: the neighbours tile keeps its countries.
        files:
          - create: dashboards/poland-overview.yaml
          - delete: dashboards/overview.yaml
          - edit: packages/semantic/src/dashboards.test.ts
          - edit: apps/portal/src/dashboards.test.ts
          - edit: README.md
          - edit: docs/dashboards.md
        steps:
          - "poland-overview.yaml: schema 2, id poland-overview, title_en 'Poland in the data', title_pl 'Polska w danych', description_en as today, description_pl 'Próbka Gold PoC. Kliknij słupek województwa, aby zobaczyć szczegóły.', domain_key economy."
          - "Six tiles in today's order: title_en = title, kpi_key = metric, note_en = note, chart and selects unchanged; view = filters as params in the same order, values joined by '|' (fx_rate: 'breakdown_json={\"currency\":\"EUR\"}|{\"currency\":\"USD\"}' single-quoted)."
