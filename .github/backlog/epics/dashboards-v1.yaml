key: bi/dashboards/v1
area: bi/dashboards
title: Dashboard YAML v2 and five domain dashboards
phase: 1
priority: P1
target: 2027-01-23
why: >-
  Most visitors will not build a view; they open a ready dashboard on a topic. Today there is one
  sample dashboard. Five topic dashboards on real KPIs are the v1 promise, and the YAML format must
  carry domains, global slicers and references to explorer views so tiles stay consistent.
outcome: >-
  Five dashboards (Poland overview, Labour market, Prices & money, Population, Regional comparison)
  declared in Dashboard YAML v2, validated in CI against the published catalogue and smoke-tested
  tile by tile on every deploy (F8).
in_scope:
  - Dashboard YAML v2 schema and validator (domain, kpi_key, global slicers, tile → view)
  - Migration of overview.yaml to v2
  - The five dashboards, PL/EN titles, freshness per tile, "Open in explorer" on every tile
out_of_scope:
  - Public finance, housing and portfolio dashboards (later, as sources land / Phase 2)
  - User-built dashboards
done_when:
  - "dashboards/ holds 5 v2 files; ops/check-dashboards.ts validates them against catalog.json in CI"
  - "Deploy smoke checks every tile of every dashboard and passes"
  - "Every tile opens the same view in the explorer"
depends_on: [bi/platform/hardening, bi/platform/published-loader]
deliverables:
  - key: bi/dashboards/v1/schema-v2
    title: Dashboard YAML v2 schema and validator
    depends_on: [bi/platform/quality/api-tests]
    done_when:
      - "validateDashboard accepts v2 files (schema: 2) and v1 files during the migration; tests for both"
    tasks:
      - key: bi/dashboards/v1/schema-v2/doc
        type: Task
        title: Document Dashboard YAML v2 in docs/dashboards.md
        effort: S
        state: open
        context: >-
          Dashboards are YAML in dashboards/ (today v1: id, title, description, tiles of {title, note?,
          metric, chart: line|bar, selects?, filters}); the format lives only in a comment of
          dashboards/overview.yaml and in README "Adding a dashboard". v2 is the contract the validator,
          the smoke test and the five domain dashboards are built against, so it is written down first.
        files:
          - create: docs/dashboards.md
          - edit: README.md
        steps:
          - "docs/dashboards.md, section 'Version 1 (today)': the fields above with one line each, as read by apps/portal/src/dashboards.ts."
          - "Section 'Version 2': a table field | type | required | meaning with exactly these rows: schema (2, required); id (kebab-case, = file name, required); title_pl, title_en (string, required); description_pl, description_en (string, optional); domain_key (a domain key of catalog.json, required); slicers (list of 'geography' and/or 'period', optional, default none); tiles (list, required, 1–12)."
          - "Tile table: title_pl, title_en (required); kpi_key (a KPI key of catalog.json, required); view (explorer URL query without '?', e.g. 'rows=geo&cols=time&geo_level=voivodeship', required); chart (line | bar | multiples | ranking | map, required); selects (boolean, optional, as in v1); note_pl, note_en (optional)."
          - "Section 'Rules': slicer values override the same parameter in every tile's view; '$selected' keeps its v1 meaning; a v1 file has no schema field and stays valid until the five-dashboards Deliverable migrates it."
          - "A complete v2 example of one dashboard with two tiles (population line, unemployment ranking) in a yaml code block."
          - "README.md 'Adding a dashboard': add 'Format: docs/dashboards.md.'"
        acceptance:
          - "docs/dashboards.md has the sections Version 1 (today), Version 2, Rules and an example"
          - "the example parses with the yaml package and has schema: 2"
        verify:
          - run: "bun -e \"const t=await Bun.file('docs/dashboards.md').text();const y=t.split('```yaml')[1].split('```')[0];console.log(require('yaml').parse(y).schema)\""
            expect: "2"
          - run: bun install --frozen-lockfile && bun run check
            expect: exit 0
        out_of_scope:
          - validator and code changes (next Tasks)
          - migrating overview.yaml
      - key: bi/dashboards/v1/schema-v2/validator
        type: Task
        title: Validate Dashboard YAML v2 files next to v1
        effort: M
        state: open
        depends_on: [bi/dashboards/v1/schema-v2/doc]
        context: >-
          packages/semantic/src/dashboards.ts validateDashboard(d, file) checks v1 files only. docs/dashboards.md
          defines v2. catalog.json is not published yet, so this Task checks structure only; kpi_key and
          domain_key against the catalogue come later. The portal and ops/check-dashboards.ts both call
          validateDashboard, so both accept v2 once it does.
        files:
          - edit: packages/semantic/src/dashboards.ts
          - edit: packages/semantic/src/dashboards.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "Add types TileV2 {title_pl; title_en; kpi_key; view: string; chart: 'line' | 'bar' | 'multiples' | 'ranking' | 'map'; selects?: boolean; note_pl?; note_en?} and DashboardV2 {schema: 2; id; title_pl; title_en; description_pl?; description_en?; domain_key; slicers?: ('geography' | 'period')[]; tiles: TileV2[]} (strings unless stated); export both from index.ts."
          - "validateDashboard: schema === 2 → v2 rules; schema absent → today's v1 rules unchanged; any other value → `${file}: unsupported schema <value>`."
          - "v2 rules (each message prefixed `${file}: `): id matches /^[a-z0-9]+(-[a-z0-9]+)*$/ ('id must be kebab-case'); when file ends in .yaml, id equals its base name without .yaml ('id must equal the file name'); title_pl, title_en, domain_key non-empty ('needs <field>'); slicers items are 'geography' or 'period' ('unknown slicer <x>'); tiles has 1–12 items ('needs 1–12 tiles')."
          - "v2 tile rules (prefix `${file}: tile <n>: `, n from 1): title_pl, title_en, kpi_key non-empty; kpi_key matches /^[a-z0-9_]+$/; view does not start with '?' and new URLSearchParams(view) has a key; chart is one of the five; selects, if present, is boolean."
          - "Tests: the yaml example from docs/dashboards.md (read with node:fs) is valid as validateDashboard(example, 'dashboards/population-labour.yaml'); v1 still valid; schema 3 rejected; bad id; id ≠ file name; unknown slicer; 0 and 13 tiles; chart 'pie'; view starting with '?'; missing kpi_key — each gives its message."
        acceptance:
          - "≥ 10 v2 cases pass; existing v1 tests pass unchanged"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
          - run: bun ops/check-dashboards.ts
            expect: dashboards ok
        out_of_scope:
          - "kpi_key, domain_key or view keys against catalog.json (needs data/metadata/catalogue-v1)"
          - "Rendering v2 dashboards; migrating overview.yaml"
      - key: bi/dashboards/v1/schema-v2/tile-queries
        type: Task
        title: Make tile-queries.ts list v2 tiles for the smoke test
        effort: S
        state: open
        depends_on: [bi/dashboards/v1/schema-v2/validator]
        context: >-
          ops/tile-queries.ts prints 'title<TAB>api path' for every v1 tile (metric + filters); ops/smoke.sh
          requests each path. A v2 tile has title_en, kpi_key and view instead. Until the API serves KPIs,
          a v2 tile is listed only when kpi_key is a metric id of today's manifest; its view params pass
          through as filters. Other v2 tiles are skipped with a stderr line so the smoke test does not fail.
        files:
          - edit: ops/tile-queries.ts
        steps:
          - "Type the parsed file as {schema?: number; tiles: unknown[]}. Without schema keep today's v1 code path exactly."
          - "schema 2: per tile {title_en, kpi_key, view}: if metric(kpi_key) from @zohelo/semantic is undefined, console.error(`skip ${title_en}: ${kpi_key} not in the manifest`) and continue. Else p = new URLSearchParams(view); delete rows, cols, t and view from p; replace '$selected' values by the sample as v1 does; print `${title_en.replace('$selected', sample)}\\t/api/metrics/${kpi_key}/series?${p}`."
          - "Commit no v2 file to dashboards/; test with a temporary file as in Verify."
        acceptance:
          - "With only overview.yaml, the output is identical to before"
          - "A v2 tile population with view geography_level=country&rows=date_key prints /api/metrics/population/series?geography_level=country"
        verify:
          - run: "bun ops/tile-queries.ts > /tmp/after.txt && git stash && bun ops/tile-queries.ts > /tmp/before.txt && git stash pop && diff /tmp/before.txt /tmp/after.txt"
            expect: no difference
          - run: "printf 'schema: 2\\nid: t\\ntitle_pl: T\\ntitle_en: T\\ndomain_key: d\\ntiles:\\n  - {title_pl: P, title_en: P, kpi_key: population, view: geography_level=country&rows=date_key, chart: line}\\n  - {title_pl: X, title_en: X, kpi_key: wages, view: rows=geo, chart: bar}\\n' > dashboards/t.yaml && bun ops/tile-queries.ts; rm dashboards/t.yaml"
            expect: "P<TAB>/api/metrics/population/series?geography_level=country on stdout; 'skip X: wages not in the manifest' on stderr"
        out_of_scope:
          - "Changing ops/smoke.sh; committing any v2 dashboard file"
    todo:
      - "Validate kpi_key, domain_key and view keys of v2 files against catalog.json fixtures (depends_on data/metadata/catalogue-v1)"
  - key: bi/dashboards/v1/global-slicers
    title: Global slicers and tile links
    depends_on: [bi/dashboards/v1/schema-v2]
    done_when:
      - "Geography and period slicers apply to every tile; each tile has 'Open in explorer'"
    tasks:
      - key: bi/dashboards/v1/global-slicers/view-params
        type: Task
        title: Merge slicer values into tile views and build explorer links
        effort: S
        state: open
        depends_on: [bi/dashboards/v1/schema-v2/validator]
        context: >-
          docs/dashboards.md does not name the parameters a slicer overrides. Architect decision (28 Oct):
          geography sets geography_name (today's area filter column); period sets from and to, inclusive
          date_key prefixes such as 2015 or 2015-01 (read by the explorer, Task explorer-period). The
          dashboard page and tile links will call these pure functions.
        files:
          - create: packages/semantic/src/dashboard-view.ts
          - create: packages/semantic/src/dashboard-view.test.ts
          - edit: packages/semantic/src/index.ts
          - edit: docs/dashboards.md
        steps:
          - "dashboard-view.ts: export const SLICER_PARAMS = {geography: ['geography_name'], period: ['from', 'to']} as const; export type Slicer = keyof typeof SLICER_PARAMS; export type SlicerValues = Record<string, string>."
          - "slicerValues(params: URLSearchParams, slicers: Slicer[]): SlicerValues — for each slicer in order, each of its parameter names whose params.get(name) is a non-empty string after trim() is copied (trimmed)."
          - "slicerParams(values: SlicerValues): URLSearchParams — the non-empty values, in insertion order."
          - "mergeView(view: string, values: SlicerValues): string — p = new URLSearchParams(view); for each non-empty [k, v] of values p.set(k, v); return p.toString()."
          - "tileExploreHref(tile: {kpi_key: string; view: string}, values: SlicerValues): string — '/explore?' + new URLSearchParams([['metric', tile.kpi_key], ...new URLSearchParams(mergeView(tile.view, values))])."
          - "Export all of the above from packages/semantic/src/index.ts."
          - "docs/dashboards.md, first Rules bullet: add that `geography` sets `geography_name` and `period` sets `from` and `to` (inclusive `date_key` prefixes, e.g. `2015`)."
        acceptance:
          - "slicerValues(new URLSearchParams('geography_name=Mazowieckie&from=2015&to=&x=1'), ['geography', 'period']) equals {geography_name: 'Mazowieckie', from: '2015'}; with slicers ['period'] it equals {from: '2015'}"
          - "mergeView('rows=date_key&geography_name=Polska', {geography_name: 'Śląskie'}) keeps rows and sets geography_name to Śląskie (one occurrence)"
          - "mergeView with {} returns the view unchanged"
          - "tileExploreHref({kpi_key: 'population', view: 'rows=date_key'}, {from: '2015'}) is '/explore?metric=population&rows=date_key&from=2015'"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - Dashboard.tsx and the slicer UI
          - The explorer reading from/to (Task explorer-period)
      - key: bi/dashboards/v1/global-slicers/explorer-period
        type: Task
        title: Let the explorer limit the period with from and to
        effort: S
        state: open
        context: >-
          The period slicer (architect decision 28 Oct, see Task view-params) passes from and to to the
          explorer: inclusive date_key prefixes such as 2015, 2015-01 or 2015-01-31. Today
          apps/portal/src/pages/Explorer.tsx shows every row the API returns. The limit is applied in the
          browser to the rows already fetched (the API is unchanged). date_key values are ISO strings
          (YYYY, YYYY-MM or YYYY-MM-DD).
        files:
          - create: apps/portal/src/period.ts
          - create: apps/portal/src/period.test.ts
          - edit: apps/portal/src/pages/Explorer.tsx
        steps:
          - "period.ts: export function inPeriod(dateKey: string, from?: string, to?: string): boolean — true when (!from or dateKey.slice(0, from.length) >= from) and (!to or dateKey.slice(0, to.length) <= to)."
          - "export function parsePeriod(params: URLSearchParams): {from?: string; to?: string} — each of from, to kept only when it matches /^\\d{4}(-\\d{2}(-\\d{2})?)?$/."
          - "Explorer.tsx: const {from, to} = parsePeriod(url.searchParams); rows = (series.data ?? []).filter((r) => inPeriod(r.date_key, from, to)), memoised on series.data, from and to; the matrix pivots these rows (not series.data); the chart, the Rows table and both downloads use them too. truncated keeps testing the unfiltered length."
          - "go(): add 'from' and 'to' to the list of kept params (rows, cols, t, base, from, to)."
          - "Next to the Transform select: two <input type=\"text\" inputMode=\"numeric\" placeholder=\"YYYY\" size={10}> with aria-label \"From\" and \"To\", value from the URL; on change navigate with the param set (removed when empty) and other params kept, as pickTransform does."
        acceptance:
          - "inPeriod('2014', '2015') false; inPeriod('2015-06', '2015') true; inPeriod('2016-01-01', undefined, '2015-12') false; inPeriod('2015-12-31', undefined, '2015-12') true; inPeriod('2020') true"
          - "parsePeriod('from=2015&to=abc') gives {from: '2015'}"
          - "/explore?metric=population&from=2015 shows no column before 2015 in the matrix and no row before 2015 in the Rows table"
        verify:
          - run: bun run test && bun run lint && bun run check && bun run build
            expect: all pass
        out_of_scope:
          - Sending from/to to the API (server/query.ts)
          - A date picker widget
      - key: bi/dashboards/v1/global-slicers/slicer-bar
        type: Task
        title: Add the SlicerBar component with tests
        effort: S
        state: open
        depends_on: [bi/dashboards/v1/global-slicers/view-params]
        context: >-
          A v2 dashboard declares slicers: [geography] and/or [period] (docs/dashboards.md). The page shows
          one bar above the tiles; its values go to the URL and into every tile (slicerValues, mergeView in
          packages/semantic/src/dashboard-view.ts, keys geography_name, from, to). This Task builds the
          presentational bar only; Dashboard.tsx renders it when it renders v2 files (later Task). Tests use
          renderToStaticMarkup (vitest environment is node).
        files:
          - create: apps/portal/src/components/SlicerBar.tsx
          - create: apps/portal/src/components/SlicerBar.test.tsx
          - edit: apps/portal/src/styles.css
        steps:
          - "export function SlicerBar({slicers, values, geographies, onChange}: {slicers: Slicer[]; values: SlicerValues; geographies: string[]; onChange: (next: SlicerValues) => void}) (Slicer, SlicerValues from @zohelo/semantic). Render nothing (return null) when slicers is empty."
          - "Root <div className=\"slicer-bar\" role=\"group\" aria-label=\"Slicers\">, controls in the order of slicers."
          - "geography: <label>Area <select aria-label=\"Area\" value={values.geography_name ?? ''}> with <option value=\"\">All areas</option> then one option per geographies value, text display('geography_name', g) from ../labels. onChange: next = {...values}; set geography_name, or delete it when ''; call onChange(next)."
          - "period: two <input type=\"text\" inputMode=\"numeric\" placeholder=\"YYYY\" size={10}> labelled 'From' and 'To' (aria-label), values values.from and values.to ?? ''; onChange sets or deletes from / to the same way."
          - "styles.css, at the end: .slicer-bar {display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 0 0 16px;}"
        acceptance:
          - "slicers [] renders ''"
          - "slicers ['geography'] with geographies ['Mazowieckie', 'Śląskie'] and values {geography_name: 'Śląskie'} renders 'All areas', both names and the Śląskie option selected; no From input"
          - "slicers ['period', 'geography'] renders the From input before the Area select, with value=\"2015\" for values {from: '2015'}"
          - "No page imports SlicerBar"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - Dashboard.tsx; reading or writing the URL
          - Loading the list of geographies
      - key: bi/dashboards/v1/global-slicers/v2-loader
        type: Task
        title: Load v2 dashboard files in the portal next to v1
        effort: S
        state: open
        depends_on: [bi/dashboards/v1/schema-v2/validator]
        context: >-
          apps/portal/src/dashboards.ts bundles dashboards/*.yaml, validates each with validateDashboard and
          casts every file to the v1 Dashboard type, so a valid v2 file (schema: 2) would reach Dashboard.tsx
          and crash it (no metric, no filters). This Task splits the two versions; v2 dashboards are exported
          but not rendered yet.
        files:
          - edit: apps/portal/src/dashboards.ts
          - create: apps/portal/src/dashboards.test.ts
        steps:
          - "Export function splitDashboards(entries: [string, string][]): {v1: Dashboard[]; v2: DashboardV2[]}: per [file, text], d = parse(text) as unknown; problems = validateDashboard(d, file); problems → throw new Error(problems.join('; ')); (d as {schema?: unknown}).schema === 2 → v2, else v1."
          - "Sort v1 exactly as today (overview first, then title); sort v2 with id 'poland-overview' first, then title_en (localeCompare)."
          - "export const {v1: dashboards, v2: dashboardsV2} = splitDashboards(Object.entries(files)); also re-export the types DashboardV2 and TileV2 from @zohelo/semantic next to Dashboard and Tile."
          - "dashboards.test.ts: inline yaml strings: a v1 board (id x, one population line tile), the v2 example of docs/dashboards.md with id b-board / title_en 'Alpha', and a v2 'poland-overview' with title_en 'Zeta'."
        acceptance:
          - "tests: the three entries split into 1 v1 and 2 v2, v2 order poland-overview then b-board; a v2 file with tiles [] throws an error containing 'needs 1–12 tiles'; dashboards (the real files) has ids ['overview'] and dashboardsV2 is []"
          - "App.tsx and Dashboard.tsx unchanged"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
          - run: bun run build
            expect: exit 0
        out_of_scope:
          - Rendering v2 dashboards; adding a v2 file to dashboards/
    todo:
      - "Render v2 dashboard files (dashboardsV2 from Task v2-loader) in apps/portal/src/pages/Dashboard.tsx: SlicerBar above the tiles, slicer values in the URL, tile header link from tileExploreHref (needs a kpi_key → data mapping: depends_on bi/platform/published-loader/switch)"
      - "Freshness badge per tile from catalog.json freshness"
  - key: bi/dashboards/v1/five-dashboards
    title: Five domain dashboards
    depends_on: [bi/dashboards/v1/global-slicers]
    done_when:
      - "poland-overview, labour-market, prices-money, population, regional-comparison are live and pass smoke"
    tasks:
      - key: bi/dashboards/v1/five-dashboards/poland-overview
        type: Task
        title: Migrate the overview dashboard to poland-overview (schema 2)
        effort: S
        state: open
        contract: false
        context: 'A domain dashboard as a schema 2 file (docs/dashboards.md); the portal validates v2 files but renders them only
          after global-slicers. Views are explorer URL params: rows/cols name dimension columns, filters are column=value, ''|''
          between values.'
        files:
        - create: dashboards/poland-overview.yaml
        - edit: apps/portal/src/dashboards.test.ts
        steps:
        - 'Create dashboards/poland-overview.yaml: schema: 2, id: poland-overview, title_pl: Polska w danych, title_en: Poland in
          the data, domain_key: economy, slicers: [period].'
        - 'Tiles (title_pl / title_en · kpi_key · chart · view): [1] Ludność Polski, źródła / Population of Poland, sources · population
          · line · `rows=source_system&cols=date_key&geography_level=country&geography_name=Polska`; [2] Ludność według województw
          (GUS) / Population by voivodeship (GUS) · population · bar · selects · `rows=geography_name&cols=date_key&geography_level=wojewodztwo&source_system=gus_dbw`;
          [3] $selected: ludność / $selected: population · population · line · `rows=source_system&cols=date_key&geography_level=wojewodztwo&geography_name=$selected`;
          [4] Stopa bezrobocia, Polska i sąsiedzi / Unemployment rate, Poland and neighbours · unemployment_rate · line · `rows=geography_name&cols=date_key&geography_level=country&source_system=eurostat&geography_name=Polska|Germany|Czechia|Lithuania`;
          [5] Inflacja w Polsce / Inflation in Poland · inflation · line · `rows=source_system&cols=date_key&geography_name=Polska`;
          [6] EUR i USD (NBP) / EUR and USD (NBP) · fx_rate · line · `rows=breakdown_json&cols=date_key&breakdown_json={"currency":"EUR"}|{"currency":"USD"}`.'
        - 'dashboards.test.ts ''bundled dashboards'': replace `expect(dashboardsV2).toEqual([]);` with `expect(dashboardsV2.map((d)
          => d.id)).toContain("poland-overview");`'
        - bunx prettier --write dashboards/poland-overview.yaml.
        acceptance:
        - dashboards/poland-overview.yaml is valid
        - 6 tiles in the listed order with both titles
        - the bundled-dashboards test allows more v2 files
        verify:
        - run: bun install --frozen-lockfile && bun run check && bun run lint && bun run format:check && bun run test
          expect: exit 0
        - run: bun ops/check-dashboards.ts
          expect: dashboards ok
        - run: bun ops/tile-queries.ts
          expect: a line per poland-overview tile with a manifest metric
        out_of_scope:
        - rendering v2 dashboards (global-slicers)
        - dashboards/overview.yaml and other dashboard files
      - key: bi/dashboards/v1/five-dashboards/labour-market
        type: Task
        title: Add the labour-market dashboard file (schema 2)
        effort: S
        state: open
        contract: false
        context: 'A domain dashboard as a schema 2 file (docs/dashboards.md); the portal validates v2 files but renders them only
          after global-slicers. Views are explorer URL params: rows/cols name dimension columns, filters are column=value, ''|''
          between values.'
        files:
        - create: dashboards/labour-market.yaml
        steps:
        - 'Create dashboards/labour-market.yaml: schema: 2, id: labour-market, title_pl: Rynek pracy, title_en: Labour market, domain_key:
          labour, slicers: [period].'
        - 'Tiles (title_pl / title_en · kpi_key · chart · view): [1] Stopa bezrobocia (BAEL), Polska / Unemployment rate (LFS),
          Poland · unemployment_rate · line · `rows=source_system&cols=date_key&geography_level=country&geography_name=Polska`;
          [2] Stopa bezrobocia według województw / Unemployment rate by voivodeship · unemployment_rate · ranking · `rows=geography_name&cols=date_key&geography_level=wojewodztwo`;
          [3] Stopa bezrobocia rejestrowanego / Registered unemployment rate · registered_unemployment_rate · line · `rows=source_system&cols=date_key&geography_name=Polska`;
          [4] Wskaźnik zatrudnienia / Employment rate · employment_rate · line · `rows=source_system&cols=date_key&geography_name=Polska`;
          [5] Przeciętne wynagrodzenie brutto / Average gross wage · average_gross_wage · line · `rows=source_system&cols=date_key&geography_name=Polska`.'
        - bunx prettier --write dashboards/labour-market.yaml.
        acceptance:
        - dashboards/labour-market.yaml is valid
        - 5 tiles in the listed order with both titles
        verify:
        - run: bun install --frozen-lockfile && bun run check && bun run lint && bun run format:check && bun run test
          expect: exit 0
        - run: bun ops/check-dashboards.ts
          expect: dashboards ok
        - run: bun ops/tile-queries.ts
          expect: a line per labour-market tile with a manifest metric
        out_of_scope:
        - rendering v2 dashboards (global-slicers)
        - dashboards/overview.yaml and other dashboard files
        - 'KPIs not yet in the manifest (draft in kpi.csv): tile-queries skips them, that is expected'
        depends_on:
