key: bi/catalogue/kpi-page
area: bi/catalogue
title: KPI page
phase: 1
priority: P1
target: 2027-01-16
why: >-
  Analysts and journalists need to know what a number means before they use it: definition, how
  each source measures it, which cuts exist, licence and how to cite. One stable URL per KPI is also
  what zohelo.com and data.zohelo.com link to.
outcome: >-
  /kpi/<kpi_key> shows the definition PL/EN, sources with methodology notes, the dimensions with
  member counts and levels, licence, freshness, a citation and a first chart (F2).
in_scope:
  - Route /kpi/<kpi_key>, data from catalog.json and kpi/<key>/latest.json
  - First chart and "Open in explorer"
  - Citation text and licence attribution
out_of_scope:
  - Related-KPI recommendations beyond same subgroup
  - API link (F13, Phase 2)
done_when:
  - "Every published KPI has a page; unknown keys show a 404 page"
  - "Page lists dimensions with member counts and geography levels from kpi_dimension"
  - "Citation reads: '<name>, <source(s)>, zohelo-bi, accessed <date>, bi.zohelo.com/kpi/<key>'"
  - "Licence and attribution come from dim_licence"
depends_on: [bi/catalogue/kpi-catalogue, data/metadata/catalogue-v1, data/published/published-v1]
deliverables:
  - key: bi/catalogue/kpi-page/page
    title: KPI page route and content
    done_when:
      - "/kpi/<key> renders all sections for the 5 PoC KPIs and every new published KPI"
    tasks:
      - key: bi/catalogue/kpi-page/page/facts
        type: Task
        title: Add citation, headline and source rows for the KPI page
        effort: S
        state: open
        depends_on: [bi/platform/quality/tooling/vitest]
        context: >-
          The KPI page shows a citation, a headline value and a sources table. Inputs are subsets of
          catalog.json and kpi/<key>/latest.json rows (zohelo-data docs/published.md); nothing is published
          yet, so these are pure functions the page wires later. Fixtures: zohelo-data
          warehouse/published/fixtures/ (commit 47bb8da).
        files:
          - create: packages/semantic/src/kpi.ts
          - create: packages/semantic/src/kpi.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "citation(kpi: {kpi_key: string; name_en: string}, sourceNames: string[], accessed: Date): string = `${name_en}, ${sourceNames.join('; ')}, zohelo-bi, accessed ${accessed.toISOString().slice(0, 10)}, bi.zohelo.com/kpi/${kpi_key}`."
          - "Types LatestValue {source_key, geography_level, period: string; value: number; previous_period?: string; previous_value?: number}; Headline {source_key, period: string; value: number; previous_period?: string; delta: number | null}."
          - "headline(values: LatestValue[], sourceOrder: string[]): Headline | null: candidates = values with geography_level 'country'; pick the candidate of the first source in sourceOrder that has one, else the first candidate; none → null; delta = previous_value === undefined ? null : value − previous_value; copy previous_period when present."
          - "Type SourceRow {source_key, name_en, register_id: string; licence_name, licence_url, attribution_text: string | null}. sourceRows(sourceKeys: string[], sources: {source_key; name_en; register_id; licence_key: string}[], licences: {licence_key; name; url; attribution_text: string}[]): SourceRow[] in sourceKeys order; a key missing from sources is skipped; a missing licence gives nulls."
          - "Export the functions and types from packages/semantic/src/index.ts (alphabetical order of module path)."
        acceptance:
          - "tests: citation({kpi_key: 'unemployment_rate', name_en: 'Unemployment rate (LFS)'}, ['Eurostat', 'World Bank – WDI'], 2026-10-28) equals the template exactly"
          - "tests: kpi/unemployment_rate/latest.json values give period 2025, value 3.2, delta ≈ 0.3 (toBeCloseTo); no country value → null; source order respected"
          - "tests: sourceRows(['nbp', 'unknown'], catalog sources, licences) → one row, licence_name 'NBP terms of use (illustrative)'; unknown licence_key → null licence fields"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - React components and the /kpi route
      - key: bi/catalogue/kpi-page/page/sections
        type: Task
        title: Add the KPI page section components with tests
        effort: M
        state: open
        depends_on: [bi/platform/quality/tooling/vitest]
        context: >-
          The KPI page (/kpi/<key>) has a value header, sources and dimensions tables and a citation.
          No data is published yet: presentational components with own prop types (field names as
          in Task page/facts), rendered by no route yet.
        files:
          - create: apps/portal/src/components/KpiSections.tsx
          - create: apps/portal/src/components/KpiSections.test.tsx
          - edit: apps/portal/src/styles.css
        steps:
          - "KpiHeader({name_en, name_pl, unitSymbol, headline}), headline: {period: string; value: number; previous_period?: string; delta: number | null} | null: <header className=\"kpi-head\"> with <h1>, <p className=\"kpi-name-pl\" lang=\"pl\">, <p className=\"kpi-value\">{formatNumber(value)} {unitSymbol} <span className=\"hint\">{period}</span></p>, and if delta is not null <p className=\"hint\">{delta > 0 ? '+' : ''}{formatNumber(delta)} vs {previous_period}</p>; null headline → <p className=\"empty\">No published value yet.</p>."
          - "SourcesTable({rows}), row {source_key, name_en, register_id: string; licence_name, licence_url, attribution_text: string | null} (local type): columns Source, Register id (mono), Licence (<a href={licence_url} target=\"_blank\" rel=\"noreferrer\">, else '–'), Attribution; no rows → <p className=\"empty\">No sources listed.</p>."
          - "DimensionsTable({geoLevels: string[]; dimensions: {dimension_key: string; member_count: number; levels: string[]}[]}): columns Dimension, Members (num), Levels; row 1 geography, –, geoLevels.join(', '); then per dimension key, formatNumber(member_count), levels.join(', ')."
          - "Citation({text}): <section className=\"citation\"><h2>How to cite</h2><blockquote>{text}</blockquote> and a Copy button (className button) calling navigator.clipboard.writeText(text)."
          - "Tables sit in <div className=\"table-wrap\">. styles.css, after .status-waiting: .kpi-value {font-size: 2rem; font-weight: 600}."
        acceptance:
          - "tests (renderToStaticMarkup): value 3.2, '%', delta 0.3, previous_period 2024 → '3.2' and '+0.3 vs 2024'; null headline → 'No published value yet.'; SourcesTable → 'GL-001', the cc-by-4.0 href, '–' for a null licence, 'No sources listed.' for []; DimensionsTable → 'country, voivodeship', 'currency', '33'; Citation text in a blockquote"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - The /kpi/:key route, data loading, a chart
          - A definition section (catalog.json has no definition)
      - key: bi/catalogue/kpi-page/page/kpi-view
        type: Task
        title: Compose the KPI page body from catalog.json and latest.json
        effort: M
        state: open
        depends_on: [bi/catalogue/kpi-page/page/facts, bi/catalogue/kpi-page/page/sections]
        context: >-
          packages/semantic/src/kpi.ts (citation, headline, sourceRows, LatestValue) and
          apps/portal/src/components/KpiSections.tsx (KpiHeader, SourcesTable, DimensionsTable, Citation)
          are not put together anywhere. KpiView renders one KPI from loaded catalog.json and latest.json
          values, so the later /kpi/:key route only loads data.
        files:
          - create: apps/portal/src/components/KpiView.tsx
          - create: apps/portal/src/components/KpiView.test.tsx
        steps:
          - "Export type KpiCatalog = {kpis: {kpi_key; name_en; name_pl; unit_key; source_keys: string[]; geo_levels: string[]; dimensions: {dimension_key: string; member_count: number; levels: string[]}[]}[]; units: {unit_key; symbol}[]; sources: {source_key; name_en; register_id; licence_key}[]; licences: {licence_key; name; url; attribution_text}[]} (untyped fields are string)."
          - "Export function KpiView({catalog, kpiKey, latest, accessed}: {catalog: KpiCatalog; kpiKey: string; latest: LatestValue[] | null; accessed: Date}). No kpi with kpiKey → <p className=\"empty\">Unknown KPI: {kpiKey}</p>."
          - "rows = sourceRows(kpi.source_keys, catalog.sources, catalog.licences); h = latest ? headline(latest, kpi.source_keys) : null; unitSymbol = the unit's symbol, else kpi.unit_key."
          - "Return <article className=\"kpi-view\">: <KpiHeader name_en name_pl unitSymbol headline={h} />; <section className=\"panel\"><h2>Sources</h2><SourcesTable rows={rows} /></section>; <section className=\"panel\"><h2>Dimensions</h2><DimensionsTable geoLevels={kpi.geo_levels} dimensions={kpi.dimensions} /></section>; <Citation text={citation(kpi, rows.map((r) => r.name_en), accessed)} />."
          - "Tests (renderToStaticMarkup): consts from zohelo-data warehouse/published/fixtures/ catalog/catalog.json and kpi/unemployment_rate/latest.json (commit 47bb8da); accessed 2026-10-28T12:00:00Z."
        acceptance:
          - "tests: unemployment_rate shows '3.2 %', '+0.3 vs 2024', 'GL-001', 'GL-005', 'country, voivodeship' and 'Unemployment rate (LFS), Eurostat; World Bank – WDI, zohelo-bi, accessed 2026-10-28, bi.zohelo.com/kpi/unemployment_rate'"
          - "tests: latest null → 'No published value yet.'; fx_rate with latest [{source_key: 'nbp', geography_level: 'country', period: '2026-10-27', value: 4.25}] → '4.25 zł', 'currency', '33'; 'nope' → 'Unknown KPI: nope'"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
        out_of_scope:
          - The /kpi/:key route, data loading, a chart
      - key: bi/catalogue/kpi-page/page/not-found
        type: Task
        title: Route unknown paths to a Page not found page
        effort: S
        state: open
        context: >-
          apps/portal/src/App.tsx picks the page with path.startsWith checks and renders the first dashboard
          for every other path, so /kpi/x or /d/typo silently show the overview. The KPI page needs a real
          404 for unknown keys. This Task moves the choice into a pure pageFor() function and adds a
          NotFound page; later routes (/kpi/:key, v2 dashboards) extend pageFor.
        files:
          - create: apps/portal/src/routes.ts
          - create: apps/portal/src/routes.test.ts
          - create: apps/portal/src/pages/NotFound.tsx
          - create: apps/portal/src/pages/NotFound.test.tsx
          - edit: apps/portal/src/App.tsx
        steps:
          - "routes.ts: export type Page = {kind: 'explore'} | {kind: 'catalogue'} | {kind: 'dashboard'; id: string} | {kind: 'not-found'}; export function pageFor(pathname: string, dashboardIds: string[]): Page."
          - "pageFor: path = pathname.replace(/\\/+$/, '') || '/'; '/explore' → explore; '/catalogue' → catalogue; '/' → dashboard dashboardIds[0], or not-found when the list is empty; /^\\/d\\/([a-z0-9-]+)$/ with the id in dashboardIds → that dashboard; anything else → not-found."
          - "NotFound.tsx: export function NotFound({path}: {path: string}) → <div className=\"page\"><div className=\"page-head\"><h1>Page not found</h1><p className=\"lede\">Nothing lives at <code>{path}</code>.</p></div><p><Link to=\"/\">Go to the dashboard</Link> · <Link to=\"/catalogue\">Browse the catalogue</Link></p></div> (Link from ../router)."
          - "App.tsx: page = pageFor(url.pathname, dashboards.map((d) => d.id)); board = page.kind === 'dashboard' ? dashboards.find((d) => d.id === page.id) : undefined; <main> renders Explorer for explore, Catalogue for catalogue, <Dashboard key={board.id} dashboard={board} /> when board is set, else <NotFound path={path} />. Keep the nav and its active-link logic unchanged."
        acceptance:
          - "routes.test.ts: '/' and '/d/overview' → dashboard overview; '/explore/' → explore; '/catalogue' → catalogue; '/d/nope', '/kpi/fx_rate' and '/explore/x' → not-found; '/' with [] → not-found"
          - "NotFound.test.tsx (renderToStaticMarkup): 'Page not found', '<code>/kpi/x</code>', href=\"/\" and href=\"/catalogue\""
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
          - run: bun run build
            expect: exit 0
        out_of_scope:
          - The /kpi/:key route
          - A 404 HTTP status (Pages serves index.html; the page is client-side)
    todo:
      - "Router: pageFor kind 'kpi' for /kpi/:key rendering KpiView with /api/catalog and kpi/<key>/latest.json; unknown key → NotFound (depends_on bi/platform/published-loader/switch)"
      - "Definition section (catalog.json has no definition field yet: zohelo-data contract change)"
      - "First chart from kpi/<key>/series (line, default filters from the catalogue)"
  - key: bi/catalogue/kpi-page/links
    title: Links in and out
    depends_on: [bi/catalogue/kpi-page/page]
    done_when:
      - "Catalogue cards, explorer header and dashboard tiles link to /kpi/<key>"
    tasks:
      - key: bi/catalogue/kpi-page/links/related
        type: Task
        title: Add a same-subgroup related-KPIs function with tests
        effort: S
        state: open
        depends_on: [bi/platform/quality/tooling/vitest]
        context: >-
          The KPI page lists related KPIs: the other KPIs of the same subgroup (Epic out_of_scope: nothing
          beyond the subgroup). catalog.json kpis[] rows carry subgroup_key (e.g. 'labour.employment.lfs')
          and name_en (zohelo-data docs/published.md). This Task adds the pure function only.
        files:
          - create: packages/semantic/src/related.ts
          - create: packages/semantic/src/related.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "related.ts: export type RelatedKpi = {kpi_key: string; name_en: string; subgroup_key: string}; export function relatedKpis<T extends RelatedKpi>(kpiKey: string, kpis: T[], limit = 6): T[]."
          - "relatedKpis: target = kpis.find((k) => k.kpi_key === kpiKey); none → []; else the rows with target's subgroup_key and a different kpi_key, sorted by name_en (localeCompare 'en'), first limit rows."
          - "index.ts: add export { relatedKpis, type RelatedKpi } from './related' between the './pivot' and './search' lines."
          - "related.test.ts: the 5 kpis of zohelo-data warehouse/published/fixtures/catalog/catalog.json (commit 47bb8da; kpi_key, name_en, subgroup_key only) plus two test rows in labour.employment.lfs: employment_rate 'Employment rate (LFS)' and activity_rate 'Activity rate (LFS)'."
        acceptance:
          - "tests: unemployment_rate → [activity_rate, employment_rate]; limit 1 → [activity_rate]; fx_rate → []; 'nope' → []; the target itself is never returned"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
        out_of_scope:
          - A RelatedKpis component and the KPI page
          - Related KPIs from other subgroups
    todo:
      - "Explorer header shows the KPI name linking to its page (after the /kpi/:key route)"
      - "RelatedKpis list on KpiView using relatedKpis, each linking to /kpi/<key> (after the /kpi/:key route)"
