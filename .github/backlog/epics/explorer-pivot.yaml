key: bi/explorer/pivot
area: bi/explorer
title: Pivot explorer
phase: 1
priority: P1
target: 2027-01-16
why: >-
  Analysts think in matrices: regions on rows, years on columns, the KPI in the cells, like the
  Eurostat Data Browser or a Power BI matrix. Today's explorer shows one line chart and a flat row
  list, so every comparison needs a download and Excel.
outcome: >-
  A user puts up to two dimensions on rows and on columns, filters the rest, applies a transform
  (latest, YoY, index, share, rank) and shares or downloads the exact view by URL.
in_scope:
  - Pure pivot and transform functions with tests in packages/semantic (F3, F5)
  - Matrix component with sticky headers, flags and units (F3, F6)
  - Shelves UI (rows, columns, filters), URL state, CSV/XLSX download (F3, F7)
out_of_scope:
  - Saved views and watchlists (F11, Phase 2)
  - DuckDB-WASM for large cuts (F14, Phase 2)
  - Charts other than the existing line chart (Epic bi/explorer/visuals)
done_when:
  - "Explorer has shelves Rows, Columns, Filters; ≤ 2 dimensions per axis; time on columns by default"
  - "Transforms latest, YoY %, change vs previous, index = 100, share of total, rank give the documented results in tests"
  - "Every view state is in the URL; reloading the URL restores the same matrix"
  - "Download CSV and XLSX of the matrix as shown"
  - "A cut over 50,000 cells shows 'narrow a dimension' instead of rendering"
decisions:
  - "D4 (27 Oct): pivot and transforms are bi logic and live in packages/semantic; chart specs live in @zohelo/design (zohelo repo) after its visuals move"
deliverables:
  - key: bi/explorer/pivot/engine
    title: Pivot and transform functions
    depends_on: [bi/platform/quality/tooling]
    done_when:
      - "packages/semantic exports pivot() and the six transforms, each with unit tests"
    tasks:
      - key: bi/explorer/pivot/engine/pivot
        type: Task
        title: Add a pure pivot function with tests
        effort: M
        state: open
        context: >-
          The matrix needs rows turned into a grid. KPIs are often non-additive (rates), so the pivot never
          sums: two source rows landing in one cell is a conflict, not a total.
        files:
          - create: packages/semantic/src/pivot.ts
          - create: packages/semantic/src/pivot.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "Types: PivotInput {rows: Record<string, unknown>[]; rowDims: string[]; colDims: string[]; value: string; maxCells?: number (default 50000)}; PivotResult {rowKeys: string[][]; colKeys: string[][]; cells: (number|null)[][]; conflicts: number; truncated: boolean}."
          - "Throw Error('max 2 dimensions per axis') if rowDims or colDims has more than 2 entries."
          - "Keys = distinct tuples of the dims' values (null → '∅'); sort each position: ISO-date-like strings ascending, numbers numerically, else localeCompare('pl')."
          - "If rowKeys.length × colKeys.length > maxCells: return truncated true, empty cells, keys still filled."
          - "Each cell = Number(value) of the single matching row; no match → null; ≥ 2 matches → null and conflicts += 1."
          - "Export from packages/semantic/src/index.ts."
        acceptance: ["Tests: 2×2 grid; empty cells null; conflict counted; truncation; 3 dims throws; date sort", "No dependency added", "Nothing added to packages/visuals (decision D4)"]
        verify: [{run: "bun run test && bun run check", expect: all pass}]
        out_of_scope: ["Totals rows/columns", "React components"]
      - key: bi/explorer/pivot/engine/transforms
        type: Task
        title: Add the six explorer transforms with tests
        effort: M
        state: open
        context: >-
          F5. Transforms run in the browser on one series at a time (sorted by period) or on one period
          across members. Results must be exact and null-safe so the matrix never shows a fake number.
        files:
          - create: packages/semantic/src/transforms.ts
          - create: packages/semantic/src/transforms.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "Point = {period: string; value: number|null}. Frequency = 'A'|'Q'|'M'|'D'."
          - "latest(points): last point with a non-null value, else null."
          - "changePrev(points): value − previous value (null if either null); first point null."
          - "yoy(points, freq): (v / v_lag − 1) × 100 with lag 1/4/12 points for A/Q/M; for D match the period exactly one year earlier by date string, else null; null when lag value is 0 or null."
          - "index(points, basePeriod): v / v_base × 100; all null if the base is missing or 0."
          - "share(values: Record<string, number|null>, totalKey = '_T'): v / values[totalKey] × 100; null without a total."
          - "rank(values): 1 = largest; nulls unranked (null); ties share the lower rank."
        acceptance: ["Every rule above has at least one test, incl. null and zero cases"]
        verify: [{run: "bun run test", expect: all pass}]
        out_of_scope: ["Per-capita and currency conversion (F16)"]
  - key: bi/explorer/pivot/matrix
    title: Matrix view in the explorer on today's API
    depends_on: [bi/explorer/pivot/engine]
    done_when:
      - "Explorer shows a Matrix tab (default) next to the chart for the current metric and filters"
    tasks:
      - key: bi/explorer/pivot/matrix/component
        type: Task
        title: Add the PivotMatrix component and a Matrix tab
        effort: L
        state: open
        context: >-
          apps/portal/src/pages/Explorer.tsx renders SeriesChart and a 50-row DataTable from api.series()
          (SeriesRow: geography_name, date_key, source_system, value, unit…). The matrix uses the same rows,
          so it works on PoC data.
        depends_on: [bi/explorer/pivot/engine/pivot, bi/platform/quality/tooling/vitest]
        files:
          - create: apps/portal/src/components/PivotMatrix.tsx
          - create: apps/portal/src/components/PivotMatrix.test.tsx
          - edit: apps/portal/src/pages/Explorer.tsx
          - edit: apps/portal/src/styles.css
          - edit: vitest.config.ts
        steps:
          - "PivotMatrix props: {result: PivotResult; unit: string; rowLabels: string[]; colLabels: string[]}; render a <table> with nested <th> for 2-level keys, sticky first column and header (position: sticky), numbers via formatNumber from ../labels with font-variant-numeric: tabular-nums, null as '–', unit in the <caption>."
          - "If result.truncated: render <p class=\"hint\">Too many cells (n). Narrow a dimension.</p> instead of the table; if conflicts > 0 add <p class=\"hint\">n cells had more than one value and are left empty.</p>."
          - "Wrap the table in <div class=\"matrix\" tabindex=\"0\" role=\"region\" aria-label=\"Matrix\">, overflow: auto."
          - "Explorer: tabs Matrix | Chart (URL param view=matrix|chart, default matrix: read with url.searchParams.get('view') from useLocation(); go() keeps view when it builds the URL, a tab click calls navigate with the same params plus view); matrix = pivot({rows, rowDims: ['geography_name', 'source_system'], colDims: ['date_key'], value: 'value'}). Keep the Rows table and CSV download below as today."
          - "vitest.config.ts: include also '**/*.test.tsx'; add esbuild: {jsx: 'automatic'}."
          - "PivotMatrix.test.tsx (renderToStaticMarkup from react-dom/server, no DOM library): a 16 × 3 result renders 16 body rows and 3 value columns; a null cell renders '–'; truncated renders the hint and no <table>; conflicts 2 renders the conflict hint."
        acceptance:
          - "4 component tests pass"
          - "Explorer defaults to the Matrix tab; ?view=chart shows today's chart (code path visible in Explorer.tsx)"
          - "Lint, type check and build pass; deploy smoke passes"
        verify:
          - {run: "bun run test && bun run lint && bun run check && bun run build", expect: "all pass; 4 PivotMatrix tests"}
          - {workflow: Check on the PR, expect: "green; smoke passed (13 checks)"}
        out_of_scope: ["Shelves UI", "Transforms in the UI", "Checking the Access-protected preview"]
  - key: bi/explorer/pivot/shelves
    title: Shelves, transforms and downloads
    depends_on: [bi/explorer/pivot/matrix]
    done_when:
      - "Rows/Columns/Filters shelves with ≤ 2 dims each, swap button, transform picker; all in the URL"
      - "Download CSV and XLSX of the matrix as shown"
    tasks:
      - key: bi/explorer/pivot/shelves/xlsx-writer
        type: Task
        title: Write a pivot matrix as an .xlsx file (pure function)
        effort: M
        state: open
        depends_on: [bi/explorer/pivot/engine/pivot, bi/platform/quality/tooling/vitest]
        context: >-
          The explorer must download the matrix as shown, as CSV and XLSX. Architect decision (28 Oct): no
          spreadsheet library; the .xlsx is written by hand (four XML parts) and zipped with fflate
          (≈ 8 kB gz, exact version 0.8.2). The function is pure so it is tested in Node and reused by the
          download button later.
        files:
          - create: packages/semantic/src/xlsx.ts
          - create: packages/semantic/src/xlsx.test.ts
          - edit: packages/semantic/src/index.ts
          - edit: packages/semantic/package.json
          - edit: bun.lock
        steps:
          - "In packages/semantic run `bun add fflate@0.8.2 --exact`."
          - "xlsx.ts: export matrixToXlsx(result: PivotResult, opts: {rowHeader: string[]; title: string; unit: string}): Uint8Array."
          - "Sheet layout: row 1 cell A1 = `${title} (${unit})`; then one header row per column level (row headers in the first opts.rowHeader.length columns, column keys after them); then one row per result.rowKeys entry: its key parts as strings, then the cells as numbers; null cells are left out of the XML (empty)."
          - "Parts (zipSync with strToU8): [Content_Types].xml, _rels/.rels, xl/workbook.xml (one sheet named 'Matrix'), xl/_rels/workbook.xml.rels, xl/worksheets/sheet1.xml. Strings are inline strings (<c t=\"inlineStr\"><is><t>…</t></is></c>), XML-escaped (& < > \" '); numbers <c><v>…</v></c>; cell refs A1-style (column letters beyond Z: AA, AB …)."
          - "If result.truncated, throw Error('matrix truncated: narrow a dimension')."
          - "Export matrixToXlsx from packages/semantic/src/index.ts."
        acceptance:
          - "tests: unzip the output with fflate unzipSync; sheet1.xml has A1 title, the header row, a number cell for a value and no cell for a null; column 27 is 'AA'; '&' in a label is escaped; a truncated result throws"
        verify:
          - run: bun run test && bun run check
            expect: all pass
        out_of_scope:
          - the download button and CSV (shelves UI Task)
          - styles, number formats, column widths
      - key: bi/explorer/pivot/shelves/xlsx-button
        type: Task
        title: Add a Download XLSX button for the explorer matrix
        effort: S
        state: open
        depends_on: [bi/explorer/pivot/shelves/xlsx-writer, bi/explorer/pivot/matrix/component]
        context: >-
          matrixToXlsx(result, {rowHeader, title, unit}) in packages/semantic/src/xlsx.ts returns the .xlsx
          bytes (Uint8Array) and throws on a truncated matrix. apps/portal/src/pages/Explorer.tsx builds
          `matrix` with pivot() and has a 'Download CSV' button in the Rows panel that calls
          download(name, text) from components/DataTable.tsx, which always makes a text/csv Blob.
          TypeScript 5.9 rejects a Uint8Array<ArrayBufferLike> as a BlobPart, so the bytes are copied with
          new Uint8Array(bytes).
        files:
          - edit: apps/portal/src/components/DataTable.tsx
          - edit: apps/portal/src/pages/Explorer.tsx
        steps:
          - "DataTable.tsx: change the signature to download(name: string, data: BlobPart, type = 'text/csv;charset=utf-8') and build new Blob([data], {type}). The existing CSV call stays unchanged."
          - "Explorer.tsx: import matrixToXlsx from @zohelo/semantic; add const XLSX_TYPE = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' at module level."
          - "In the Rows panel header, wrap the buttons in <div style={{display: 'flex', gap: 8}}> (no CSS file change) and add after 'Download CSV': <button type=\"button\" className=\"button\" disabled={!rows.length || matrix.truncated} onClick={() => download(`${m.id}.xlsx`, new Uint8Array(matrixToXlsx(matrix, {rowHeader: ['Area', 'Source'], title: m.label, unit: m.unitLabel})), XLSX_TYPE)}>Download XLSX</button>."
        acceptance:
          - "Explorer shows 'Download XLSX' next to 'Download CSV'; it is disabled for a truncated matrix or no rows (code path visible in Explorer.tsx)"
          - "The CSV download behaves as before"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check && bun run build
            expect: all pass
          - workflow: Check on the PR
            expect: "green; smoke passed"
        out_of_scope:
          - A CSV of the matrix (today's CSV is the rows)
          - Changing xlsx.ts or the matrix layout
      - key: bi/explorer/pivot/shelves/matrix-transform
        type: Task
        title: Apply explorer transforms to a pivot matrix (pure function)
        effort: M
        state: open
        depends_on: [bi/explorer/pivot/engine/transforms, bi/explorer/pivot/engine/pivot]
        context: >-
          packages/semantic/src/transforms.ts has latest, changePrev, yoy, index and rank on one series
          (Point[]) or one period (Record). The explorer shows a PivotResult (pivot.ts: rowKeys, colKeys,
          cells[row][col], conflicts, truncated) with the period as the only column dimension, sorted
          ascending. The transform picker needs one function that applies a transform to the whole matrix
          and a unit label. share() is left out: today's rows have no total member.
        files:
          - create: packages/semantic/src/matrix.ts
          - create: packages/semantic/src/matrix.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "export type MatrixTransform = 'none' | 'latest' | 'changePrev' | 'yoy' | 'index' | 'rank'; export const MATRIX_TRANSFORMS: MatrixTransform[] in that order."
          - "transformMatrix(result, t, opts: {freq: Frequency; basePeriod?: string}): PivotResult. 'none' or result.truncated → return result itself."
          - "For latest, changePrev, yoy, index: if any colKey has length ≠ 1 throw Error('time transforms need the period as the only column dimension'); per row build points = colKeys.map((k, c) => ({period: k[0], value: cells[r][c] ?? null}))."
          - "changePrev / yoy(points, opts.freq) / index(points, opts.basePeriod ?? colKeys[0][0]): the row's cells become the returned values. latest: colKeys becomes [['Latest']] and each row's cells [latest(points)?.value ?? null]."
          - "rank: per column c, rank(Object.fromEntries(rowKeys.map((_, r) => [String(r), cells[r][c]]))) and write each row's rank back."
          - "Return a new object {...result, colKeys, cells}; never mutate the input."
          - "transformUnit(t, unit, basePeriod): 'none', 'latest', 'changePrev' → unit; 'yoy' → '%'; 'index' → `index, ${basePeriod} = 100`; 'rank' → 'rank'."
          - "Export the type, the constant and both functions from packages/semantic/src/index.ts (alphabetical order of module path)."
        acceptance:
          - "tests on rows [100, 110, 121] and [50, null, 60] over 2020–2022 (freq A): changePrev [null, 10, 11] / [null, null, null]; yoy [null, 10, 10]; index [100, 110, 121] / [100, null, 120]; latest colKeys [['Latest']], cells [[121], [60]]; rank columns [1, 2], [1, null], [1, 2]"
          - "tests: two-level colKeys with yoy throws; truncated input and 'none' return the same object; the input is not mutated; transformUnit cases"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - The picker UI and the transform URL param
          - share of total
      - key: bi/explorer/pivot/shelves/shelves-state
        type: Task
        title: Add pure shelves state for rows and columns in the URL
        effort: S
        state: open
        depends_on: [bi/platform/quality/tooling/vitest]
        context: >-
          The shelves UI puts up to two dimensions on Rows and on Columns; the rest are filters. The state
          lives in the URL as rows=a,b&cols=c next to the explorer's other params (metric, view, filters).
          Today Explorer.tsx hard-codes rowDims ['geography_name', 'source_system'] and colDims
          ['date_key']. This Task adds the pure state functions; the UI uses them later.
        files:
          - create: packages/semantic/src/shelves.ts
          - create: packages/semantic/src/shelves.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "export type Shelves = {rows: string[]; cols: string[]}; export const MAX_PER_SHELF = 2."
          - "parseShelves(params: URLSearchParams, dims: string[], defaults: Shelves): Shelves: rows = params.has('rows') ? clean(params.get('rows')) : defaults.rows; cols likewise from 'cols'; clean = split on ',', trim, keep names in dims, drop duplicates, first MAX_PER_SHELF; then remove from cols any name also in rows."
          - "writeShelves(params: URLSearchParams, s: Shelves): URLSearchParams: a copy of params with rows and cols set to the names joined by ','; an empty shelf is written as an empty param (cols=) so it reloads empty."
          - "swapShelves(s): {rows: s.cols, cols: s.rows}."
          - "moveDim(s, dim, target: 'rows' | 'cols' | 'filters'): remove dim from both shelves; for rows or cols append it, and if the shelf then holds more than MAX_PER_SHELF drop its first entry; return a new object."
          - "shelfFilters(s, dims): dims not on either shelf, in dims order."
          - "Export from packages/semantic/src/index.ts (alphabetical order of module path)."
        acceptance:
          - "tests: missing params → defaults; 'rows=a,x,a&cols=a,c' with dims [a, b, c] → rows [a], cols [c]; three names keep the first two; writeShelves keeps metric=…; an empty cols shelf round-trips through writeShelves and parseShelves as []; swap; moveDim to a full shelf drops its first entry; moveDim to filters; shelfFilters order"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - The shelves UI and Explorer.tsx
          - Filter values (the existing column=a|b params)
    todo:
      - "Shelves UI: move dimensions between Rows, Columns, Filters (click and keyboard), swap axes, using shelves.ts (after Task shelves-state)"
      - "Transform picker in Explorer.tsx using transformMatrix and transformUnit; transform=<name> in the URL (after Task matrix-transform)"
      - "Observation flags and breaks as superscripts with legend (F6) — needs flags in the published series (depends_on data/published/published-v1)"
      - "Rebuild shelves on kpi_key and catalogue dimensions instead of manifest columns (depends_on data/metadata/catalogue-v1)"
