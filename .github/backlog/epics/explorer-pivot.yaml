key: bi/explorer/pivot
area: bi/explorer
title: Pivot explorer
phase: 1
priority: P1
target: 2027-01-16
why: >-
  Analysts think in matrices: regions on rows, years on columns, the KPI in the cells, like the
  Eurostat Data Browser or a Power BI matrix. Today's explorer shows one line chart and a flat row
  list, so every comparison needs a download and Excel.
outcome: >-
  A user puts up to two dimensions on rows and on columns, filters the rest, applies a transform
  (latest, YoY, index, share, rank) and shares or downloads the exact view by URL.
in_scope:
  - Pure pivot and transform functions with tests in packages/semantic (F3, F5)
  - Matrix component with sticky headers, flags and units (F3, F6)
  - Shelves UI (rows, columns, filters), URL state, CSV/XLSX download (F3, F7)
out_of_scope:
  - Saved views and watchlists (F11, Phase 2)
  - DuckDB-WASM for large cuts (F14, Phase 2)
  - Charts other than the existing line chart (Epic bi/explorer/visuals)
done_when:
  - "Explorer has shelves Rows, Columns, Filters; ≤ 2 dimensions per axis; time on columns by default"
  - "Transforms latest, YoY %, change vs previous, index = 100, share of total, rank give the documented results in tests"
  - "Every view state is in the URL; reloading the URL restores the same matrix"
  - "Download CSV and XLSX of the matrix as shown"
  - "A cut over 50,000 cells shows 'narrow a dimension' instead of rendering"
decisions:
  - "D4 (27 Oct): pivot and transforms are bi logic and live in packages/semantic; chart specs live in @zohelo/design (zohelo repo) after its visuals move"
deliverables:
  - key: bi/explorer/pivot/engine
    title: Pivot and transform functions
    depends_on: [bi/platform/quality/tooling]
    done_when:
      - "packages/semantic exports pivot() and the six transforms, each with unit tests"
    tasks:
      - key: bi/explorer/pivot/engine/pivot
        type: Task
        title: Add a pure pivot function with tests
        effort: M
        state: open
        context: >-
          The matrix needs rows turned into a grid. KPIs are often non-additive (rates), so the pivot never
          sums: two source rows landing in one cell is a conflict, not a total.
        files:
          - create: packages/semantic/src/pivot.ts
          - create: packages/semantic/src/pivot.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "Types: PivotInput {rows: Record<string, unknown>[]; rowDims: string[]; colDims: string[]; value: string; maxCells?: number (default 50000)}; PivotResult {rowKeys: string[][]; colKeys: string[][]; cells: (number|null)[][]; conflicts: number; truncated: boolean}."
          - "Throw Error('max 2 dimensions per axis') if rowDims or colDims has more than 2 entries."
          - "Keys = distinct tuples of the dims' values (null → '∅'); sort each position: ISO-date-like strings ascending, numbers numerically, else localeCompare('pl')."
          - "If rowKeys.length × colKeys.length > maxCells: return truncated true, empty cells, keys still filled."
          - "Each cell = Number(value) of the single matching row; no match → null; ≥ 2 matches → null and conflicts += 1."
          - "Export from packages/semantic/src/index.ts."
        acceptance: ["Tests: 2×2 grid; empty cells null; conflict counted; truncation; 3 dims throws; date sort", "No dependency added", "Nothing added to packages/visuals (decision D4)"]
        verify: [{run: "bun run test && bun run check", expect: all pass}]
        out_of_scope: ["Totals rows/columns", "React components"]
      - key: bi/explorer/pivot/engine/transforms
        type: Task
        title: Add the six explorer transforms with tests
        effort: M
        state: open
        context: >-
          F5. Transforms run in the browser on one series at a time (sorted by period) or on one period
          across members. Results must be exact and null-safe so the matrix never shows a fake number.
        files:
          - create: packages/semantic/src/transforms.ts
          - create: packages/semantic/src/transforms.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "Point = {period: string; value: number|null}. Frequency = 'A'|'Q'|'M'|'D'."
          - "latest(points): last point with a non-null value, else null."
          - "changePrev(points): value − previous value (null if either null); first point null."
          - "yoy(points, freq): (v / v_lag − 1) × 100 with lag 1/4/12 points for A/Q/M; for D match the period exactly one year earlier by date string, else null; null when lag value is 0 or null."
          - "index(points, basePeriod): v / v_base × 100; all null if the base is missing or 0."
          - "share(values: Record<string, number|null>, totalKey = '_T'): v / values[totalKey] × 100; null without a total."
          - "rank(values): 1 = largest; nulls unranked (null); ties share the lower rank."
        acceptance: ["Every rule above has at least one test, incl. null and zero cases"]
        verify: [{run: "bun run test", expect: all pass}]
        out_of_scope: ["Per-capita and currency conversion (F16)"]
  - key: bi/explorer/pivot/matrix
    title: Matrix view in the explorer on today's API
    depends_on: [bi/explorer/pivot/engine]
    done_when:
      - "Explorer shows a Matrix tab (default) next to the chart for the current metric and filters"
    tasks:
      - key: bi/explorer/pivot/matrix/component
        type: Task
        title: Add the PivotMatrix component and a Matrix tab
        effort: L
        state: open
        context: >-
          apps/portal/src/pages/Explorer.tsx renders SeriesChart and a 50-row DataTable from api.series()
          (SeriesRow: geography_name, date_key, source_system, value, unit…). The matrix uses the same rows,
          so it works on PoC data.
        depends_on: [bi/explorer/pivot/engine/pivot, bi/platform/quality/tooling/vitest]
        files:
          - create: apps/portal/src/components/PivotMatrix.tsx
          - create: apps/portal/src/components/PivotMatrix.test.tsx
          - edit: apps/portal/src/pages/Explorer.tsx
          - edit: apps/portal/src/styles.css
          - edit: vitest.config.ts
        steps:
          - "PivotMatrix props: {result: PivotResult; unit: string; rowLabels: string[]; colLabels: string[]}; render a <table> with nested <th> for 2-level keys, sticky first column and header (position: sticky), numbers via formatNumber from ../labels with font-variant-numeric: tabular-nums, null as '–', unit in the <caption>."
          - "If result.truncated: render <p class=\"hint\">Too many cells (n). Narrow a dimension.</p> instead of the table; if conflicts > 0 add <p class=\"hint\">n cells had more than one value and are left empty.</p>."
          - "Wrap the table in <div class=\"matrix\" tabindex=\"0\" role=\"region\" aria-label=\"Matrix\">, overflow: auto."
          - "Explorer: tabs Matrix | Chart (URL param view=matrix|chart, default matrix: read with url.searchParams.get('view') from useLocation(); go() keeps view when it builds the URL, a tab click calls navigate with the same params plus view); matrix = pivot({rows, rowDims: ['geography_name', 'source_system'], colDims: ['date_key'], value: 'value'}). Keep the Rows table and CSV download below as today."
          - "vitest.config.ts: include also '**/*.test.tsx'; add esbuild: {jsx: 'automatic'}."
          - "PivotMatrix.test.tsx (renderToStaticMarkup from react-dom/server, no DOM library): a 16 × 3 result renders 16 body rows and 3 value columns; a null cell renders '–'; truncated renders the hint and no <table>; conflicts 2 renders the conflict hint."
        acceptance:
          - "4 component tests pass"
          - "Explorer defaults to the Matrix tab; ?view=chart shows today's chart (code path visible in Explorer.tsx)"
          - "Lint, type check and build pass; deploy smoke passes"
        verify:
          - {run: "bun run test && bun run lint && bun run check && bun run build", expect: "all pass; 4 PivotMatrix tests"}
          - {workflow: Check on the PR, expect: "green; smoke passed (13 checks)"}
        out_of_scope: ["Shelves UI", "Transforms in the UI", "Checking the Access-protected preview"]
  - key: bi/explorer/pivot/shelves
    title: Shelves, transforms and downloads
    depends_on: [bi/explorer/pivot/matrix]
    done_when:
      - "Rows/Columns/Filters shelves with ≤ 2 dims each, swap button, transform picker; all in the URL"
      - "Download CSV and XLSX of the matrix as shown"
    tasks:
      - key: bi/explorer/pivot/shelves/xlsx-writer
        type: Task
        title: Write a pivot matrix as an .xlsx file (pure function)
        effort: M
        state: open
        depends_on: [bi/explorer/pivot/engine/pivot, bi/platform/quality/tooling/vitest]
        context: >-
          The explorer must download the matrix as shown, as CSV and XLSX. Architect decision (28 Oct): no
          spreadsheet library; the .xlsx is written by hand (four XML parts) and zipped with fflate
          (≈ 8 kB gz, exact version 0.8.2). The function is pure so it is tested in Node and reused by the
          download button later.
        files:
          - create: packages/semantic/src/xlsx.ts
          - create: packages/semantic/src/xlsx.test.ts
          - edit: packages/semantic/src/index.ts
          - edit: packages/semantic/package.json
          - edit: bun.lock
        steps:
          - "In packages/semantic run `bun add fflate@0.8.2 --exact`."
          - "xlsx.ts: export matrixToXlsx(result: PivotResult, opts: {rowHeader: string[]; title: string; unit: string}): Uint8Array."
          - "Sheet layout: row 1 cell A1 = `${title} (${unit})`; then one header row per column level (row headers in the first opts.rowHeader.length columns, column keys after them); then one row per result.rowKeys entry: its key parts as strings, then the cells as numbers; null cells are left out of the XML (empty)."
          - "Parts (zipSync with strToU8): [Content_Types].xml, _rels/.rels, xl/workbook.xml (one sheet named 'Matrix'), xl/_rels/workbook.xml.rels, xl/worksheets/sheet1.xml. Strings are inline strings (<c t=\"inlineStr\"><is><t>…</t></is></c>), XML-escaped (& < > \" '); numbers <c><v>…</v></c>; cell refs A1-style (column letters beyond Z: AA, AB …)."
          - "If result.truncated, throw Error('matrix truncated: narrow a dimension')."
          - "Export matrixToXlsx from packages/semantic/src/index.ts."
        acceptance:
          - "tests: unzip the output with fflate unzipSync; sheet1.xml has A1 title, the header row, a number cell for a value and no cell for a null; column 27 is 'AA'; '&' in a label is escaped; a truncated result throws"
        verify:
          - run: bun run test && bun run check
            expect: all pass
        out_of_scope:
          - the download button and CSV (shelves UI Task)
          - styles, number formats, column widths
      - key: bi/explorer/pivot/shelves/downloads
        type: Task
        title: Download the matrix as CSV and XLSX
        effort: M
        state: open
        depends_on: [bi/explorer/pivot/shelves/xlsx-writer, bi/explorer/pivot/matrix/component]
        context: >-
          Today the explorer downloads only the raw rows (Rows panel, toCsv in components/DataTable.tsx).
          The matrix panel needs two buttons that download the matrix exactly as shown: CSV and XLSX
          (matrixToXlsx from @zohelo/semantic, already merged). The CSV writer is a new pure function so it
          is tested in Node.
        files:
          - create: packages/semantic/src/matrix-csv.ts
          - create: packages/semantic/src/matrix-csv.test.ts
          - edit: packages/semantic/src/index.ts
          - edit: apps/portal/src/components/DataTable.tsx
          - edit: apps/portal/src/pages/Explorer.tsx
        steps:
          - "matrix-csv.ts: export matrixToCsv(result: PivotResult, rowHeader: string[]): string. Line 1: rowHeader cells, then one cell per column key (its parts joined with ' / '). Then one line per result.rowKeys entry: its key parts, then the cells (number as String(n), null as empty). Quote a cell with \", comma or newline as in toCsv (double the quotes). Lines joined with \\n. If result.truncated throw Error('matrix truncated: narrow a dimension')."
          - "Export matrixToCsv from packages/semantic/src/index.ts."
          - "DataTable.tsx: change download to download(name: string, data: string | Uint8Array, type = 'text/csv;charset=utf-8'); the Blob gets that type. Existing callers stay valid."
          - "Explorer.tsx: give the matrix/chart panel a <header className=\"panel-head\"> with <h2>Matrix</h2> and two buttons 'CSV' and 'XLSX', both disabled when view is 'chart', rows is empty or matrix.truncated. CSV: download(`${m.id}-matrix.csv`, matrixToCsv(matrix, ['Area', 'Source'])). XLSX: download(`${m.id}-matrix.xlsx`, matrixToXlsx(matrix, {rowHeader: ['Area', 'Source'], title: m.label, unit: m.unitLabel}), 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')."
        acceptance:
          - "matrix-csv tests: header line, a null cell is empty, a label with a comma is quoted, a 2-level column key is joined with ' / ', truncated throws"
          - "Explorer shows CSV and XLSX buttons on the Matrix tab; the Rows panel download is unchanged"
        verify:
          - run: bun run test && bun run lint && bun run check && bun run build
            expect: all pass
        out_of_scope:
          - styles or number formats in the XLSX
          - downloads of the chart
      - key: bi/explorer/pivot/shelves/shelves-url
        type: Task
        title: Read matrix rows and columns from the URL, with a swap button
        effort: M
        state: open
        depends_on: [bi/explorer/pivot/shelves/downloads]
        context: >-
          Explorer.tsx builds the matrix with fixed rowDims ['geography_name', 'source_system'] and colDims
          ['date_key']. Users must choose them and share the view, so the layout moves into URL params
          rows=a,b&cols=c, parsed by a pure, tested function. The click UI to move dimensions is the next Task.
        files:
          - create: apps/portal/src/shelves.ts
          - create: apps/portal/src/shelves.test.ts
          - edit: apps/portal/src/pages/Explorer.tsx
        steps:
          - "shelves.ts: export type Shelves = {rows: string[]; cols: string[]}; export const DEFAULT_SHELVES: Shelves = {rows: ['geography_name', 'source_system'], cols: ['date_key']}."
          - "export function shelfColumns(m: Metric): {column: string; label: string}[] = m.dimensions (column, label) plus {column: 'date_key', label: 'Period'} at the end."
          - "export function parseShelves(params: URLSearchParams, allowed: string[]): Shelves. rows = params.get('rows') split on ',', keep only values in allowed, drop duplicates, first 2; cols the same from 'cols', also dropping values already in rows. If rows or cols ends up empty, return DEFAULT_SHELVES with each list filtered to allowed."
          - "export function swapShelves(s: Shelves): Shelves = {rows: s.cols, cols: s.rows}; export function shelvesToParams(s: Shelves, p: URLSearchParams): void sets 'rows' and 'cols' (joined with ',')."
          - "Explorer.tsx: shelves = parseShelves(url.searchParams, shelfColumns(m).map(c => c.column)); pivot uses shelves.rows / shelves.cols; rowLabels and colLabels are the labels from shelfColumns; the downloads use the same labels. go() keeps rows and cols when present in the URL (as it keeps view). A button 'Swap rows and columns' next to the view tabs calls swapShelves and navigates with shelvesToParams."
        acceptance:
          - "shelves tests: no params gives DEFAULT_SHELVES; rows=frequency&cols=date_key parses; unknown and duplicate columns are dropped; a column in both is kept only in rows; more than 2 are cut to 2; swap exchanges the lists"
          - "/explore without rows/cols shows today's matrix; the swap button puts periods on rows"
        verify:
          - run: bun run test && bun run lint && bun run check && bun run build
            expect: all pass
        out_of_scope:
          - moving single dimensions between shelves (next Task)
          - the Filters shelf (the filter selects stay as they are)
      - key: bi/explorer/pivot/shelves/shelves-ui
        type: Task
        title: Move dimensions between the Rows and Columns shelves
        effort: M
        state: open
        depends_on: [bi/explorer/pivot/shelves/shelves-url]
        context: >-
          After shelves-url the layout lives in rows=…&cols=… and can only be swapped. Users must move one
          dimension at a time, with the mouse or the keyboard (native buttons, no drag and drop).
        files:
          - create: apps/portal/src/components/ShelfPanel.tsx
          - create: apps/portal/src/components/ShelfPanel.test.tsx
          - edit: apps/portal/src/shelves.ts
          - edit: apps/portal/src/shelves.test.ts
          - edit: apps/portal/src/pages/Explorer.tsx
          - edit: apps/portal/src/styles.css
        steps:
          - "shelves.ts: export function moveDimension(s: Shelves, column: string, to: 'rows' | 'cols' | 'none'): Shelves. Remove column from both lists, then append it to `to` unless to is 'none'; if the target list would hold 3, return s unchanged; if rows or cols would become empty, return s unchanged."
          - "ShelfPanel props {columns: {column: string; label: string}[]; shelves: Shelves; onChange: (s: Shelves) => void}. Three groups with headings Rows, Columns, Not used; each dimension is a chip with its label and buttons 'Rows', 'Columns', 'Remove' (aria-labels '<label>: move to Rows', '<label>: move to Columns', '<label>: remove'); a button is disabled when moveDimension would return s unchanged or the chip is already there."
          - "Explorer.tsx: render ShelfPanel above the view tabs; onChange navigates with shelvesToParams (other params kept)."
          - "styles.css: .shelves (flex, gap 12px, wrap) and .chip (border, radius 999px, padding 2px 8px); use existing colour variables."
          - "ShelfPanel.test.tsx with renderToStaticMarkup: default shelves render 2 chips under Rows and 1 under Columns; a full Rows shelf renders the 'Rows' buttons of other chips disabled."
        acceptance:
          - "moveDimension tests: move to cols, move to none, full target unchanged, emptying a shelf unchanged"
          - "2 ShelfPanel tests pass; every action is reachable with Tab and Enter"
        verify:
          - run: bun run test && bun run lint && bun run check && bun run build
            expect: all pass
        out_of_scope:
          - drag and drop
          - a Filters shelf
      - key: bi/explorer/pivot/shelves/transform-matrix
        type: Task
        title: Apply a transform to every row of a pivot matrix (pure function)
        effort: S
        state: open
        depends_on: [bi/explorer/pivot/engine/transforms, bi/explorer/pivot/engine/pivot]
        context: >-
          transforms.ts works on one series (Point[]). The explorer applies a transform to the matrix when
          the columns are periods. date_key is a full ISO date (YYYY-MM-DD) for every frequency, so 'same date
          a year earlier' is right for A, Q and M too and survives gaps: yoy is always called with 'D'.
        files:
          - create: packages/semantic/src/transform-matrix.ts
          - create: packages/semantic/src/transform-matrix.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "export type MatrixTransform = 'none' | 'change' | 'yoy' | 'index'."
          - "export function transformMatrix(result: PivotResult, t: MatrixTransform, basePeriod?: string): PivotResult. 'none' returns result. Otherwise throw Error('transforms need periods as the only column dimension') unless every colKey has length 1. For each row i build points = colKeys.map((k, j) => ({period: k[0], value: cells[i][j]})) and apply changePrev(points), yoy(points, 'D') or index(points, basePeriod ?? colKeys[0][0]); return a copy of result with the new cells."
          - "export function transformUnit(t: MatrixTransform, unit: string, basePeriod: string): string = unit for none and change, '% y/y' for yoy, `index, ${basePeriod} = 100` for index."
          - "Export the three names from packages/semantic/src/index.ts."
        acceptance:
          - "tests: yoy on 2023-01-01 = 100, 2024-01-01 = 110 gives 10 in 2024 and null in 2023; a gap year gives null; index with base 2023-01-01 gives 100 and 110; change gives null then 10; a 2-level column key throws; transformUnit strings"
        verify:
          - run: bun run test && bun run check
            expect: all pass
        out_of_scope:
          - share and rank (they work across members, not along time)
          - the picker UI
      - key: bi/explorer/pivot/shelves/transform-picker
        type: Task
        title: Add a transform picker to the explorer matrix
        effort: M
        state: open
        depends_on: [bi/explorer/pivot/shelves/transform-matrix, bi/explorer/pivot/shelves/shelves-ui]
        context: >-
          transformMatrix and transformUnit exist in @zohelo/semantic. The explorer needs a picker for
          None, Change, Year on year and Index, kept in the URL (t=change|yoy|index, base=YYYY-MM-DD) and
          shown in the unit label and the downloads.
        files:
          - edit: apps/portal/src/pages/Explorer.tsx
        steps:
          - "Read t from the URL (anything else is 'none') and base (default: the first column key)."
          - "A <select aria-label=\"Transform\"> with None, Change on previous period, Year on year %, Index (base = 100) next to the view tabs; changing it navigates with t set (removed for None), other params kept. When t is index, a second <select aria-label=\"Base period\"> lists the column keys and sets base."
          - "If shelves.cols is not exactly ['date_key'], disable the picker and show <span class=\"hint\">Transforms need Period as the only column.</span>; the matrix stays untransformed."
          - "shown = transformMatrix(matrix, t, base); PivotMatrix, the CSV and the XLSX use shown; the unit is transformUnit(t, m.unitLabel, base)."
        acceptance:
          - "?t=yoy shows % y/y values and the unit '% y/y'; ?t=index&base=2015-01-01 shows 100 in 2015"
          - "With Period on rows the picker is disabled with the hint"
        verify:
          - run: bun run lint && bun run check && bun run build
            expect: all pass
        out_of_scope:
          - transforms in the chart view
          - share and rank
    todo:
      - "Observation flags and breaks as superscripts with legend (F6) — needs flags in the published series (depends_on data/published/published-v1)"
      - "Rebuild shelves on kpi_key and catalogue dimensions instead of manifest columns (depends_on data/metadata/catalogue-v1)"
