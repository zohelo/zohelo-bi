key: bi/catalogue/kpi-catalogue
area: bi/catalogue
title: KPI catalogue with domain and source trees
phase: 1
priority: P1
target: 2027-01-09
why: >-
  Users look for "unemployment in my region", not for "GUS BDL P2392". Today's catalogue lists
  source blocks. The KPI must be the first thing a user meets, found through a plain-language domain
  tree, a source tree or search with synonyms.
outcome: >-
  /catalogue shows KPI cards navigable by 12 domains → groups → subgroups or by source → dataset,
  with search by PL/EN name, synonym and source code (F1, F9).
in_scope:
  - Catalogue page on 06_published/v1/catalog/catalog.json (one file, ≤ 2 MB gz)
  - Domain tree and source tree from the same rows
  - Client-side search with synonyms and source codes
out_of_scope:
  - KPI page (Epic bi/catalogue/kpi-page)
  - Watchlist (F11, Phase 2)
done_when:
  - "Catalogue loads in < 1 s from one cached file and shows every published KPI (≥ 40)"
  - "Domain tree counts match the number of KPIs per node; source tree reaches every KPI"
  - "Search finds 'PKB', 'GDP' and 'P2392' to the right KPIs"
  - "Each card shows name, unit, frequency, geography depth, period range, sources, freshness"
depends_on: [bi/platform/published-loader, data/metadata/catalogue-v1, data/published/published-v1]
deliverables:
  - key: bi/catalogue/kpi-catalogue/page
    title: Catalogue page on the published catalogue
    done_when:
      - "/catalogue renders KPI cards from /api/catalog (catalog.json rows)"
    tasks:
      - key: bi/catalogue/kpi-catalogue/page/kpi-card
        type: Task
        title: Add the KpiCard component with tests
        effort: M
        state: open
        depends_on: [bi/platform/quality/tooling/vitest]
        context: >-
          One card per catalog.json kpis[] row (zohelo-data docs/published.md). /api/catalog does not
          serve it yet: build and test the card only. Test rows:
          zohelo-data warehouse/published/fixtures/catalog/catalog.json (commit 47bb8da).
        files:
          - create: apps/portal/src/components/KpiCard.tsx
          - create: apps/portal/src/components/KpiCard.test.tsx
          - edit: apps/portal/src/labels.ts
          - edit: apps/portal/src/styles.css
        steps:
          - "labels.ts: export GEO_LEVELS = ['country', 'nuts1', 'nuts2', 'voivodeship', 'powiat', 'gmina'], GEO_LABELS (Country, NUTS 1, NUTS 2, Voivodeship, Powiat, Gmina) and deepestGeo(levels): string | null = the known level of highest index, else null."
          - "KpiCard.tsx: export type CardKpi (string fields kpi_key, name_pl, name_en, unit_key, frequency_default, first_period, last_period, loaded_at; geo_levels: string[]) and KpiCard({kpi, unit, sourceNames}: {kpi: CardKpi; unit?: {symbol: string; name_en: string}; sourceNames: string[]})."
          - "<article className=\"kpi-card\">: <h3>name_en</h3>, <p className=\"kpi-name-pl\" lang=\"pl\">name_pl</p>, <dl className=\"kpi-facts\"> with Unit (`${unit.name_en} (${unit.symbol})`, else unit_key), Frequency (FREQUENCIES[f] ?? f), Geography (<span className=\"geo-depth\" aria-hidden=\"true\" /> + GEO_LABELS label, '–' if null), Period (`${first_period}–${last_period}`), Sources (joined ' · ')."
          - "<footer className=\"kpi-card-foot\"> with <span className=\"freshness\">Loaded {loaded_at.slice(0, 10)}</span> and <Link to={`/explore?metric=${encodeURIComponent(kpi_key)}`} className=\"tile-link\">Open in explorer</Link> (Link: ../router)."
          - "styles.css, after the .tile-link rule: .kpi-card as .tile; .kpi-name-pl muted; .kpi-facts grid auto 1fr, gap 2px 12px; .kpi-card-foot flex space-between; .freshness faint; .geo-depth inline-block 8px square, var(--muted)."
        acceptance:
          - "KpiCard.test.tsx (renderToStaticMarkup): fx_rate row with sourceNames ['National Bank of Poland'], unit {symbol 'zł', name_en 'PLN per currency unit'} shows 'Exchange rate to PLN', 'Daily', '2002-01-02–2026-10-27', 'Loaded 2026-01-01', href=\"/explore?metric=fx_rate\"; population shows 'Voivodeship'; no unit shows unit_key; deepestGeo(['gmina', 'country']) = 'gmina', deepestGeo([]) = null"
          - "No page imports KpiCard yet"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - Catalogue.tsx, /api/catalog, links to /kpi/<key>
          - Badge colours; a drawn geography icon
      - key: bi/catalogue/kpi-catalogue/page/kpi-grid
        type: Task
        title: Add the KpiGrid component with empty, error and loading states
        effort: S
        state: open
        depends_on: [bi/catalogue/kpi-catalogue/page/kpi-card]
        context: >-
          apps/portal/src/components/KpiCard.tsx renders one catalog.json kpis[] row (type CardKpi). The
          catalogue page will show a grid of cards. This Task adds the grid with its three non-data states;
          no page uses it until /api/catalog serves catalog.json. Units and sources are catalog.json units[]
          (unit_key, symbol, name_en) and sources[] (source_key, name_en) rows.
        files:
          - create: apps/portal/src/components/KpiGrid.tsx
          - create: apps/portal/src/components/KpiGrid.test.tsx
          - edit: apps/portal/src/styles.css
        steps:
          - "KpiGrid.tsx: export type GridKpi = CardKpi & {source_keys: string[]}; export function KpiGrid({kpis, units, sources, loading, error}: {kpis: GridKpi[]; units: {unit_key: string; symbol: string; name_en: string}[]; sources: {source_key: string; name_en: string}[]; loading: boolean; error?: string})."
          - "Order of states: error set → <p className=\"error\">{error}</p>; else loading and kpis empty → <div className=\"kpi-grid\" aria-busy=\"true\"> with exactly 3 <div className=\"skeleton kpi-skeleton\" />; else kpis empty → <p className=\"empty\">No KPIs match this selection.</p>."
          - "Otherwise <div className=\"kpi-grid\"> with one <KpiCard key={kpi_key} kpi={k} unit={units.find((u) => u.unit_key === k.unit_key)} sourceNames={k.source_keys.map((s) => sources.find((x) => x.source_key === s)?.name_en ?? s)} /> per row, in input order."
          - "styles.css, after the .geo-depth rule: .kpi-grid {display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px} and .skeleton.kpi-skeleton {height: 180px}."
          - "KpiGrid.test.tsx (renderToStaticMarkup): population and unemployment_rate rows, units and sources from zohelo-data warehouse/published/fixtures/catalog/catalog.json (commit 47bb8da) pasted as consts."
        acceptance:
          - "tests: 2 rows → 2 'class=\"kpi-card\"'; unemployment_rate shows '% of labour force (%)' and 'Eurostat · World Bank – WDI'; a source key missing from sources is shown as the key"
          - "tests: error 'HTTP 502' → that text in class error and no card; loading with [] → 3 'kpi-skeleton'; loading with rows → cards, no skeleton; [] not loading → 'No KPIs match this selection.'"
          - "No page imports KpiGrid yet; KpiCard.tsx unchanged"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
        out_of_scope:
          - Catalogue.tsx and /api/catalog
          - Paging or sorting the cards
    todo:
      - "Replace the source-block list in apps/portal/src/pages/Catalogue.tsx with KpiGrid and TreePanel driven by parseCatalogueParams/filterKpis; keep a 'Datasets' tab for the old view until v1 (depends_on bi/platform/published-loader/switch: /api/catalog serves catalog.json)"
  - key: bi/catalogue/kpi-catalogue/trees
    title: Domain tree and source tree
    depends_on: [bi/catalogue/kpi-catalogue/page]
    done_when:
      - "Left panel toggles domain tree / source tree; selecting a node filters the cards; node in the URL"
    tasks:
      - key: bi/catalogue/kpi-catalogue/trees/builders
        type: Task
        title: Build the domain tree and the source tree (pure functions)
        effort: M
        state: open
        depends_on: [bi/platform/quality/tooling/vitest]
        context: >-
          The catalogue's left panel navigates KPIs by domain → group → subgroup or by source. catalog.json
          (zohelo-data docs/published.md) has kpis[].domain_path (keys domain → group → subgroup),
          kpis[].source_keys, domains[] (domain_key, level, parent_key, name_en, name_pl, sort) and
          sources[] (source_key, name_en, name_pl). No dataset per KPI exists in the contract, so the source
          tree has one level. Input types are structural subsets of those rows.
        files:
          - create: packages/semantic/src/trees.ts
          - create: packages/semantic/src/trees.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "Types: TreeKpi {kpi_key: string; domain_path: string[]; source_keys: string[]}; TreeDomain {domain_key: string; level: string; parent_key: string | null; name_en: string; name_pl: string; sort: number}; TreeSource {source_key: string; name_en: string; name_pl: string}; TreeNode {key: string; name_en: string; name_pl: string; level: string; count: number; children: TreeNode[]}."
          - "domainTree(kpis, domains): TreeNode[]: roots are domains with parent_key null; a node's children are the domains whose parent_key is its key; count = number of KPIs whose domain_path includes the node key; drop nodes with count 0; siblings sorted by sort ascending, then name_en (localeCompare 'en')."
          - "sourceTree(kpis, sources): TreeNode[]: one node per source, level 'source', children [], count = KPIs whose source_keys include source_key; drop count 0; sorted by name_en (localeCompare 'en'). Source keys missing from sources are ignored."
          - "Export the four types, domainTree and sourceTree from packages/semantic/src/index.ts (alphabetical by module path)."
          - "trees.test.ts: paste kpis (kpi_key, domain_path, source_keys only), domains and sources from zohelo-data warehouse/published/fixtures/catalog/catalog.json (commit 47bb8da) into consts."
        acceptance:
          - "tests: domain roots in order economy, finance, labour, population; economy count 2 with children national_accounts then prices (count 1 each); an extra test domain without KPIs is dropped; source order Eurostat, National Bank of Poland, Statistics Poland – Local Data Bank, World Bank – WDI with counts 4, 1, 1, 4"
          - "No dependency added"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - The tree panel component and Catalogue.tsx
          - A dataset level under each source (not in the contract)
      - key: bi/catalogue/kpi-catalogue/trees/url-filter
        type: Task
        title: Add catalogue URL state and KPI filtering (pure functions)
        effort: S
        state: open
        depends_on: [bi/catalogue/kpi-catalogue/search/search-fn]
        context: >-
          The catalogue keeps its view in the URL: ?domain=<domain_key> or ?source=<source_key>, plus
          ?q=<search text>. These pure functions parse and write that state and filter catalog.json kpis[]
          rows (fields kpi_key, name_pl, name_en, domain_path, source_keys) with the existing search() in
          packages/semantic/src/search.ts. No synonyms or codes exist in catalog.json yet.
        files:
          - create: packages/semantic/src/catalogue.ts
          - create: packages/semantic/src/catalogue.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "Types: CatalogueKpi {kpi_key: string; name_pl: string; name_en: string; domain_path: string[]; source_keys: string[]}; CatalogueSelection {domain?: string; source?: string; q: string}."
          - "parseCatalogueParams(params: URLSearchParams): CatalogueSelection: domain = params.get('domain') or undefined when empty; source likewise but undefined whenever domain is set; q = params.get('q') ?? ''."
          - "catalogueParams(sel): URLSearchParams with, in this order, domain (if set), source (if set and no domain), q (if q.trim() is not empty)."
          - "filterKpis<T extends CatalogueKpi>(kpis: T[], sel): T[]: keep rows whose domain_path includes sel.domain (when set) and whose source_keys include sel.source (when set); if q.trim() is empty return them in input order; else run search(rows mapped to {key: kpi_key, name_pl, name_en}, sel.q, rows.length) and return the rows in hit order."
          - "Export the two types and three functions from packages/semantic/src/index.ts (alphabetical order of module path)."
        acceptance:
          - "tests with population, gdp_current_prices and fx_rate (names and keys as in the catalog.json fixture): '?domain=economy&source=nbp' parses to domain only; '?source=nbp&q=kurs' parses to source and q; catalogueParams round-trips; domain economy → [gdp_current_prices]; source eurostat → [population, gdp_current_prices]; q 'pkb' → [gdp_current_prices]; q 'kurs' with domain economy → []; empty q keeps input order"
        verify:
          - run: bun run test && bun run check && bun run lint
            expect: all pass
        out_of_scope:
          - Wiring into Catalogue.tsx
          - Changing search.ts
      - key: bi/catalogue/kpi-catalogue/trees/tree-panel
        type: Task
        title: Add the TreePanel component (domain / source toggle)
        effort: M
        state: open
        depends_on: [bi/catalogue/kpi-catalogue/trees/builders]
        context: >-
          packages/semantic/src/trees.ts builds TreeNode[] with domainTree() and sourceTree(). The
          catalogue's left panel shows one tree, chosen by a toggle; a node filters the cards. Presentational
          only.
        files:
          - create: apps/portal/src/components/TreePanel.tsx
          - create: apps/portal/src/components/TreePanel.test.tsx
          - edit: apps/portal/src/styles.css
        steps:
          - "Export function TreePanel({domains, sources, mode, selected, onMode, onSelect}: {domains: TreeNode[]; sources: TreeNode[]; mode: 'domain' | 'source'; selected?: string; onMode: (m: 'domain' | 'source') => void; onSelect: (key: string | undefined) => void})."
          - "<nav className=\"tree-panel\" aria-label=\"Catalogue navigation\">: a <div className=\"metric-tabs\" role=\"tablist\"> with <button type=\"button\" role=\"tab\"> 'By domain' and 'By source' (aria-selected and className 'selected' on the current mode; onClick onMode); a <button type=\"button\" className=\"tree-node\"> 'All KPIs' → onSelect(undefined); the current mode's nodes as a recursive <ul className=\"tree\"> of <li>."
          - "Node: <button type=\"button\" className=\"tree-node\" aria-current={key === selected ? 'true' : undefined} onClick={() => onSelect(key)}>{name_en} <span className=\"count\">{count}</span></button>, then a nested <ul className=\"tree\"> only when children is not empty. Class 'selected' is added to the selected node, or to 'All KPIs' when selected is undefined."
          - "styles.css, after .chip .link-button:disabled: .tree {list-style: none; margin: 0; padding-left: 12px}; .tree-node {font: inherit; background: none; border: none; padding: 2px 4px; color: inherit; cursor: pointer}; .tree-node.selected {color: var(--accent); font-weight: 600}; .tree-node .count {color: var(--faint)}."
          - "Tests build the trees with domainTree/sourceTree from the consts of packages/semantic/src/trees.test.ts (copied)."
        acceptance:
          - "tests: domain mode shows 'Economy' and 'Prices &amp; inflation', subgroup 'GDP', not 'Eurostat'; exactly 10 '<ul class=\"tree\">' (1 root + 4 domains + 5 groups)"
          - "tests: source mode shows 'National Bank of Poland', not 'Economy'; 'By source' has aria-selected=\"true\""
          - "tests: selected 'economy' → one aria-current=\"true\", on Economy; selected undefined → 'All KPIs' has class 'tree-node selected'"
        verify:
          - run: bun run test && bun run check && bun run lint && bun run format:check
            expect: all pass
        out_of_scope:
          - Catalogue.tsx, URL handling, collapsing nodes
    todo:
      - "Source tree second level (dataset) once catalog.json lists datasets per KPI (zohelo-data contract change)"
  - key: bi/catalogue/kpi-catalogue/search
    title: Search with synonyms and source codes
    depends_on: [bi/catalogue/kpi-catalogue/page]
    done_when:
      - "Search box matches name_pl, name_en, synonyms[], dataset codes; diacritics-insensitive"
    tasks:
      - key: bi/catalogue/kpi-catalogue/search/search-fn
        type: Task
        title: Add a pure KPI search function with tests
        effort: S
        state: open
        depends_on: [bi/platform/quality/tooling/vitest]
        context: >-
          Users type 'PKB', 'GDP', 'bezrobocie' or a source code like 'P2392'. The catalogue rows are not
          published yet, so the function works on a small input type of its own that the catalogue page
          maps catalog.json rows to later.
        files:
          - create: packages/semantic/src/search.ts
          - create: packages/semantic/src/search.test.ts
          - edit: packages/semantic/src/index.ts
        steps:
          - "Types: SearchItem {key: string; name_pl: string; name_en: string; synonyms?: string[]; codes?: string[]}; SearchHit {key: string; score: number}."
          - "normalise(s): lower case, NFD, remove combining marks (\\p{M}), map 'ł' to 'l', collapse whitespace, trim."
          - "search(items, query, limit = 20): q = normalise(query); empty q returns []; for each item and each term in [name_pl, name_en, ...synonyms, ...codes] (normalised): score 3 if equal to q, 2 if it starts with q, 1 if it contains q, else 0; item score = max over terms; keep score > 0; sort by score desc, then name_en ascending; return the first limit hits."
          - "Export normalise, search and the two types from packages/semantic/src/index.ts."
        acceptance:
          - "tests: 'pkb' finds an item with synonym 'PKB' (score 3); 'GDP' finds name_en 'GDP, current prices' (score 2); 'bezrob' finds name_pl 'Stopa bezrobocia' (score 1, contains); 'p2392' finds code 'P2392'; 'łódź' equals 'lodz'; empty query returns []; ties sort by name_en"
          - "no dependency added"
        verify:
          - run: bun run test && bun run check
            expect: all pass
        out_of_scope:
          - the search box UI (next todo)
          - fuzzy matching or typo tolerance
      - key: bi/catalogue/kpi-catalogue/search/search-box
        type: Task
        title: Use the KPI search in the catalogue search box
        effort: S
        state: open
        depends_on: [bi/catalogue/kpi-catalogue/search/search-fn]
        context: >-
          apps/portal/src/pages/Catalogue.tsx filters rows with a plain substring match kept in React state.
          search() and normalise() from @zohelo/semantic (merged) rank matches and ignore diacritics. Until
          catalog.json is published the box searches today's CatalogRow list; the KPI cards Task maps the
          new rows later.
        files:
          - edit: apps/portal/src/pages/Catalogue.tsx
        steps:
          - "Map rows once (useMemo) to SearchItem: key measure_key, name_pl and name_en both measure_name ?? block_name ?? block_id, codes [block_id]."
          - "The query lives in the URL param q: read it with useLocation(); on input write it with window.history.replaceState(null, '', url with q set, or removed when empty) and keep a local state copy so typing stays smooth."
          - "With a non-empty query, keep the rows whose key is in search(items, q, 5000) and order them by hit order; source and 'Modelled only' filters still apply. Without a query keep today's order."
          - "Show <span class=\"hint\">n results</span> (formatNumber) next to the filters."
          - "Ctrl+K or Cmd+K anywhere on the page focuses the input (keydown listener on window added in useEffect and removed on unmount; preventDefault)."
        acceptance:
          - "/catalogue?q=lodz lists rows naming Łódź; /catalogue?q=P2392 finds that block id; the count matches the rows listed"
          - "Ctrl+K focuses the search box"
        verify:
          - run: bun run lint && bun run check && bun run build
            expect: all pass
        out_of_scope:
          - KPI cards and catalog.json (Deliverable page)
          - fuzzy matching
