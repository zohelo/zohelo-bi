name: Deploy portal

# Pushes to main, and manual runs: build and check the portal (the design template, apps/portal/src/tpl),
# make sure the Cloudflare side matches ops/ensure-platform.ts (Pages project, Access sign-in,
# bi.zohelo.com), test the API against the real lakehouse and deploy. main goes to production
# (bi.zohelo.com); a manual run on another branch deploys a preview <branch>.zohelo-bi.pages.dev. Every
# hostname is behind Cloudflare Access (owner decision O6; the last step fails the run otherwise). Pull
# requests are checked by check.yml, which does not deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      data_mode:
        description: "Data of a preview (another branch than main): live (published contract v2) or dummy (sample data, marked on every page). main always builds live."
        type: choice
        options: [live, dummy]
        default: live

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  # Never cancel a deploy halfway (between Cloudflare setup and pages deploy); queue instead.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the Release step after a production deploy
    env:
      # zohelo organisation credentials, mapped to the names the tools read.
      CLOUDFLARE_API_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
      STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
      STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN }}
      PORTAL_SIGNIN_ALLOWED_EMAILS: ${{ secrets.PORTAL_SIGNIN_ALLOWED_EMAILS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Type check
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Dashboards match the semantic manifest
        run: bun ops/check-dashboards.ts
      - name: Build
        # Production (bi.zohelo.com, main) shows only data available in Gold through the published contract v2: the
        # live provider, never sample data (owner direction of 12 Nov 2026, decision O37; bi.zohelo.com is production
        # and the owner's review stage at once). PORTAL_TARGET=production makes vite refuse any other mode, and the
        # next step checks that the output holds no sample chunk. A manual preview of another branch may choose
        # sample data (input data_mode); the footer of every page then says "Dane przykładowe".
        env:
          VITE_DATA_MODE: ${{ github.ref == 'refs/heads/main' && 'live' || inputs.data_mode || 'live' }}
          PORTAL_TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: |
          case "$VITE_DATA_MODE" in dummy|live) ;; *) echo "::error::data mode must be dummy or live, not '$VITE_DATA_MODE'"; exit 1;; esac
          bun run build
      - name: No sample data in a live build
        if: github.ref == 'refs/heads/main' || inputs.data_mode != 'dummy'
        run: ops/check-live-build.sh
      - name: Cloudflare setup (Pages project, Access, domain)
        env:
          # Lakehouse read-only key pair for the published layer (06_published/v1), set on the Pages project.
          STORAGE_ENDPOINT_URL: ${{ vars.STORAGE_ENDPOINT_URL }}
          STORAGE_LAKEHOUSE_READ_ACCESS_KEY: ${{ secrets.STORAGE_LAKEHOUSE_READ_ACCESS_KEY }}
          STORAGE_LAKEHOUSE_READ_SECRET_KEY: ${{ secrets.STORAGE_LAKEHOUSE_READ_SECRET_KEY }}
        run: bun ops/ensure-platform.ts
      - name: Smoke test against the lakehouse
        run: ops/smoke.sh
      - name: Deploy
        working-directory: apps/portal
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bunx wrangler pages deploy dist --project-name zohelo-bi --branch "$BRANCH" --commit-dirty=true | tee /tmp/deploy.log
          url=$(grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' /tmp/deploy.log | tail -1)
          if [ "$BRANCH" = main ]; then echo "::notice title=deployed::https://bi.zohelo.com ($url)"; else echo "::notice title=preview::$url"; fi
      - name: Sign-in is enforced
        run: |
          set -euo pipefail
          sleep 20
          hosts=("zohelo-bi.pages.dev" "$(echo "$GITHUB_REF_NAME" | tr '/_.' '---' | tr 'A-Z' 'a-z').zohelo-bi.pages.dev")
          # Production: the public name too (owner decision O6: bi.zohelo.com stays behind sign-in).
          if [ "$GITHUB_REF_NAME" = main ]; then hosts+=("bi.zohelo.com"); fi
          for host in "${hosts[@]}"; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://$host/api/manifest")
            case "$out" in
              30?\ *cloudflareaccess.com*) echo "::notice title=access $host::redirects to sign-in" ;;
              *) echo "::error title=access $host::not protected: $out"; exit 1 ;;
            esac
          done
      - name: Release (production deploys only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "bi-$(date -u +%Y%m%d-%H%M)" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "bi.zohelo.com $(date -u +%Y-%m-%d)" --generate-notes
