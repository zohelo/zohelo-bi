name: Check

# Every pull request: install from the lockfile, type check, check the dashboards against the
# semantic manifest, build, and smoke-test the API locally (wrangler pages dev) against the real
# lakehouse with the catalog read token, then axe-core accessibility on the key pages with that data.
# Nothing is deployed and no Cloudflare setup runs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    # The UI suite alone takes about 14 minutes; the live screenshots and the scan on live data add a few.
    timeout-minutes: 40
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actions pinned
        run: ops/check-pins.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # update when backlog_sync.py changes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zohelo/zohelo-data
          ref: 7bbed15fdbbcf82f23785ee4b0c322fb14a4c7bf
          sparse-checkout: ops/backlog_sync.py
          path: _zd
          persist-credentials: false
      - name: Linked task
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 _zd/ops/backlog_sync.py pr-check
      - name: Backlog files
        run: pip install pyyaml==6.0.3 && python3 _zd/ops/backlog_sync.py validate --root .
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Type check
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Dashboards match the semantic manifest
        run: bun ops/check-dashboards.ts
      - name: Build
        # What production deploys (deploy.yml on main): live data only, never sample data (decision O37), so the
        # accessibility step and the live screenshots scan the portal on the real published layer.
        env:
          VITE_DATA_MODE: live
          PORTAL_TARGET: production
        run: bun run build && ops/check-live-build.sh
      - name: Smoke test against the lakehouse (read token only)
        # Secrets are not passed to pull requests from forks or to Dependabot's; those skip the
        # smoke test (install, type check, dashboards and build still run). Deploy smokes on main.
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
          STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
          STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN }}
        run: ops/smoke.sh
      - name: Browser for the accessibility check
        # Playwright's Chromium at the version in bun.lock (zohelo-data#2499).
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        run: bunx playwright install --with-deps chromium
      - name: Live screenshots (home and an indicator page on the published layer)
        # The production build against the real published contract v2 (ops/live-screens.sh: wrangler pages dev with
        # the read key pair, as the accessibility step); evidence for the owner's review of live data.
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        timeout-minutes: 6
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
          STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
          STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN }}
          STORAGE_ENDPOINT_URL: ${{ vars.STORAGE_ENDPOINT_URL }}
          STORAGE_LAKEHOUSE_READ_ACCESS_KEY: ${{ secrets.STORAGE_LAKEHOUSE_READ_ACCESS_KEY }}
          STORAGE_LAKEHOUSE_READ_SECRET_KEY: ${{ secrets.STORAGE_LAKEHOUSE_READ_SECRET_KEY }}
        run: ops/live-screens.sh
      - name: Live screenshots upload
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-screenshots
          path: live-screens/
          if-no-files-found: ignore
      - name: Accessibility (axe-core, 1440 and 390 px)
        # The pages with their data (ops/a11y.sh: wrangler pages dev with the read token, as the smoke
        # test; skipped where the smoke test is). Fails on serious or critical elements not in
        # ops/a11y-baseline.json and on pages that did not load; counts by rule and page go to the summary.
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        timeout-minutes: 12
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
          STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
          STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN }}
          # The published layer (catalogue and KPI pages), as deploy.yml gives the Pages project.
          STORAGE_ENDPOINT_URL: ${{ vars.STORAGE_ENDPOINT_URL }}
          STORAGE_LAKEHOUSE_READ_ACCESS_KEY: ${{ secrets.STORAGE_LAKEHOUSE_READ_ACCESS_KEY }}
          STORAGE_LAKEHOUSE_READ_SECRET_KEY: ${{ secrets.STORAGE_LAKEHOUSE_READ_SECRET_KEY }}
        run: ops/a11y.sh
      - name: Accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: a11y-report.json
          if-no-files-found: ignore
      - name: UI template checks (axe 0 violations, focus ring, widths, chart text)
        # docs/design-template.md: every page in tests/ui/pages.json at 1440/768/390 (axe) and
        # 1280/1024/768/390 (widths); blocks merging. Runs last: it rebuilds the portal on sample data
        # (the template's routes) after the smoke and accessibility steps. Screenshots are uploaded.
        if: ${{ !cancelled() }}
        run: bunx playwright install --with-deps chromium && VITE_DATA_MODE=dummy bun run build && bun run test:ui
      - name: UI screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: tests/ui/out/
          if-no-files-found: ignore
