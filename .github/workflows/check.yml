name: Check

# Every pull request: install from the lockfile, type check, check the dashboards against the
# semantic manifest, build, and smoke-test the API locally (wrangler pages dev) against the real
# lakehouse with the catalog read token. Nothing is deployed and no Cloudflare setup runs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Type check
        run: bun run check
      - name: Dashboards match the semantic manifest
        run: bun ops/check-dashboards.ts
      - name: Build
        run: bun run build
      - name: Smoke test against the lakehouse (read token only)
        # Secrets are not passed to pull requests from forks; those skip the smoke test.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
          STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
          STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN }}
        run: ops/smoke.sh
