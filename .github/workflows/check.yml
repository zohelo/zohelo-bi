name: Check

# Every pull request: install from the lockfile, type check, check the dashboards against the
# semantic manifest, build, and smoke-test the API locally (wrangler pages dev) against the real
# lakehouse with the catalog read token, then axe-core accessibility on the key pages with that data.
# Nothing is deployed and no Cloudflare setup runs.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actions pinned
        run: ops/check-pins.sh
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # update when backlog_sync.py changes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zohelo/zohelo-data
          ref: 7bbed15fdbbcf82f23785ee4b0c322fb14a4c7bf
          sparse-checkout: ops/backlog_sync.py
          path: _zd
          persist-credentials: false
      - name: Linked task
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 _zd/ops/backlog_sync.py pr-check
      - name: Backlog files
        run: pip install pyyaml==6.0.3 && python3 _zd/ops/backlog_sync.py validate --root .
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Format
        run: bun run format:check
      - name: Type check
        run: bun run check
      - name: Unit tests
        run: bun run test
      - name: Dashboards match the semantic manifest
        run: bun ops/check-dashboards.ts
      - name: Build
        run: bun run build
      - name: Smoke test against the lakehouse (read token only)
        # Secrets are not passed to pull requests from forks or to Dependabot's; those skip the
        # smoke test (install, type check, dashboards and build still run). Deploy smokes on main.
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
          STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
          STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN }}
        run: ops/smoke.sh
      - name: Browser for the accessibility check
        # Playwright's Chromium at the version in bun.lock (zohelo-data#2499).
        run: bunx playwright install --with-deps chromium
      - name: Accessibility (axe-core, 1440 and 390 px)
        # Fails on serious or critical violations not in ops/a11y-baseline.json; counts by rule and
        # page go to the job summary. With the read token the pages are scanned with their data
        # (ops/a11y.sh); fork and Dependabot pull requests scan the built app without its API.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
          STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
          STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN }}
        run: |
          if [ -n "$STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN" ]; then ops/a11y.sh; else node ops/a11y.mjs --report a11y-report.json; fi
      - name: Accessibility report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a11y-report
          path: a11y-report.json
          if-no-files-found: ignore
