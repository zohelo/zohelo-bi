name: Check credentials

# One-off: tells whether the shared organisation secrets and variables reach this repository and
# are real values (each is tried against its service). Prints only status, never a value.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
      R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
      R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
    steps:
      - name: Check
        run: |
          set -u
          for name in CLOUDFLARE_API_TOKEN R2_DATA_CATALOG_TOKEN CLOUDFLARE_ACCOUNT_ID R2_WAREHOUSE R2_CATALOG_URI R2_LAKEHOUSE_BUCKET; do
            value="${!name}"
            echo "::notice title=$name::length ${#value}"
          done
          code=$(curl -s -o /tmp/v.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "::notice title=CLOUDFLARE_API_TOKEN verify::HTTP $code $(jq -c '{success, status: .result.status}' /tmp/v.json 2>/dev/null)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $R2_DATA_CATALOG_TOKEN" "${R2_CATALOG_URI%/}/v1/config?warehouse=$R2_WAREHOUSE")
          echo "::notice title=R2_DATA_CATALOG_TOKEN catalog config::HTTP $code"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects")
          echo "::notice title=Pages API with this token::HTTP $code"
