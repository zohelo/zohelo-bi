name: Check credentials

# Tells whether every organisation secret and variable reaches this repository and works against
# its service. Prints variable values, but for secrets only lengths and HTTP status codes.
# The storage write check puts one small object under zz_dev_credcheck/ and deletes it again.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLATFORM_ACCOUNT_ID: ${{ vars.PLATFORM_ACCOUNT_ID }}
      STORAGE_ENDPOINT_URL: ${{ vars.STORAGE_ENDPOINT_URL }}
      STORAGE_LANDING_BUCKET_NAME: ${{ vars.STORAGE_LANDING_BUCKET_NAME }}
      STORAGE_LAKEHOUSE_BUCKET_NAME: ${{ vars.STORAGE_LAKEHOUSE_BUCKET_NAME }}
      STORAGE_LAKEHOUSE_CATALOG_URL: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_URL }}
      STORAGE_LAKEHOUSE_CATALOG_NAME: ${{ vars.STORAGE_LAKEHOUSE_CATALOG_NAME }}
      ORG_BOT_APP_ID: ${{ vars.ORG_BOT_APP_ID }}
      PLATFORM_DEPLOY_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
      STORAGE_WRITE_ACCESS_KEY: ${{ secrets.STORAGE_WRITE_ACCESS_KEY }}
      STORAGE_WRITE_SECRET_KEY: ${{ secrets.STORAGE_WRITE_SECRET_KEY }}
      STORAGE_LAKEHOUSE_READ_ACCESS_KEY: ${{ secrets.STORAGE_LAKEHOUSE_READ_ACCESS_KEY }}
      STORAGE_LAKEHOUSE_READ_SECRET_KEY: ${{ secrets.STORAGE_LAKEHOUSE_READ_SECRET_KEY }}
      STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN }}
      STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN: ${{ secrets.STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN }}
      ORG_BOT_PRIVATE_KEY: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
      PORTAL_SIGNIN_ALLOWED_EMAILS: ${{ secrets.PORTAL_SIGNIN_ALLOWED_EMAILS }}
      SOURCE_GUS_BDL_API_KEY: ${{ secrets.SOURCE_GUS_BDL_API_KEY }}
      SOURCE_GUS_BDL_WEB_LOGIN: ${{ secrets.SOURCE_GUS_BDL_WEB_LOGIN }}
      SOURCE_GUS_BDL_WEB_PASSWORD: ${{ secrets.SOURCE_GUS_BDL_WEB_PASSWORD }}
    steps:
      - name: Presence
        run: |
          set -u
          V=""; S=""
          {
            echo "## Variables"
            echo "| Name | Value |"; echo "|---|---|"
            for n in PLATFORM_ACCOUNT_ID STORAGE_ENDPOINT_URL STORAGE_LANDING_BUCKET_NAME STORAGE_LAKEHOUSE_BUCKET_NAME STORAGE_LAKEHOUSE_CATALOG_URL STORAGE_LAKEHOUSE_CATALOG_NAME ORG_BOT_APP_ID; do
              echo "| $n | \`${!n:-MISSING}\` |"; V="$V $n=${!n:-MISSING}"
            done
            echo "## Secrets"
            echo "| Name | Length |"; echo "|---|---|"
            for n in PLATFORM_DEPLOY_TOKEN STORAGE_WRITE_ACCESS_KEY STORAGE_WRITE_SECRET_KEY STORAGE_LAKEHOUSE_READ_ACCESS_KEY STORAGE_LAKEHOUSE_READ_SECRET_KEY STORAGE_LAKEHOUSE_CATALOG_WRITE_TOKEN STORAGE_LAKEHOUSE_CATALOG_READ_TOKEN ORG_BOT_PRIVATE_KEY PORTAL_SIGNIN_ALLOWED_EMAILS SOURCE_GUS_BDL_API_KEY SOURCE_GUS_BDL_WEB_LOGIN SOURCE_GUS_BDL_WEB_PASSWORD; do
              v="${!n:-}"; echo "| $n | ${#v} |"; S="$S $n=${#v}"
            done
            echo "## Checks"
            echo "| Check | Expected | Result |"; echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=variables::$V"
          echo "::notice title=secret lengths::$S"

      - name: Platform deploy token
        run: |
          set -u
          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "::notice title=$1::expected $2 -> $3"; }
          api() { curl -s -o /tmp/r.json -w '%{http_code}' -H "Authorization: Bearer $PLATFORM_DEPLOY_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          a="/accounts/$PLATFORM_ACCOUNT_ID"
          row "deploy token verify" 200 "$(api "$a/tokens/verify") $(jq -r '.result.status // .errors[0].message' /tmp/r.json)"
          row "deploy: list Workers" 200 "$(api "$a/workers/scripts") $(jq -r '[.result[]?.id] | join(", ")' /tmp/r.json)"
          row "deploy: list Pages projects" 200 "$(api "$a/pages/projects") $(jq -r '[.result[]?.name] | join(", ")' /tmp/r.json)"
          row "deploy: list Access apps" 200 "$(api "$a/access/apps") $(jq -r '[.result[]?.name] | join(", ")' /tmp/r.json)"
          row "deploy: find zone zohelo.com" 200 "$(api "/zones?name=zohelo.com") $(jq -r '.result | length' /tmp/r.json) zone(s)"
          zone=$(jq -r '.result[0].id // empty' /tmp/r.json)
          if [ -n "$zone" ]; then row "deploy: list DNS records" 200 "$(api "/zones/$zone/dns_records") $(jq -r '.result | length' /tmp/r.json) record(s)"; fi

      - name: Storage keys
        env:
          AWS_DEFAULT_REGION: auto
        run: |
          set -u
          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "::notice title=$1::expected $2 -> $3"; }
          run() { if out=$("$@" 2>&1); then echo "ok"; else echo "denied/failed: $(echo "$out" | tail -1 | cut -c1-120)"; fi; }
          s3() { aws --endpoint-url "$STORAGE_ENDPOINT_URL" "$@"; }
          export AWS_ACCESS_KEY_ID="$STORAGE_WRITE_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$STORAGE_WRITE_SECRET_KEY"
          row "write keys: list landing" ok "$(run s3 s3api list-objects-v2 --bucket "$STORAGE_LANDING_BUCKET_NAME" --max-items 1)"
          row "write keys: list lakehouse" ok "$(run s3 s3api list-objects-v2 --bucket "$STORAGE_LAKEHOUSE_BUCKET_NAME" --max-items 1)"
          echo check > /tmp/probe.txt
          row "write keys: put probe in landing" ok "$(run s3 s3 cp /tmp/probe.txt "s3://$STORAGE_LANDING_BUCKET_NAME/zz_dev_credcheck/probe.txt")"
          row "write keys: delete probe" ok "$(run s3 s3 rm "s3://$STORAGE_LANDING_BUCKET_NAME/zz_dev_credcheck/probe.txt")"
          export AWS_ACCESS_KEY_ID="$STORAGE_LAKEHOUSE_READ_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$STORAGE_LAKEHOUSE_READ_SECRET_KEY"
          row "read keys: list lakehouse" ok "$(run s3 s3api list-objects-v2 --bucket "$STORAGE_LAKEHOUSE_BUCKET_NAME" --max-items 1)"
          row "read keys: list landing" denied "$(run s3 s3api list-objects-v2 --bucket "$STORAGE_LANDING_BUCKET_NAME" --max-items 1)"
          row "read keys: put in lakehouse" denied "$(run s3 s3 cp /tmp/probe.txt "s3://$STORAGE_LAKEHOUSE_BUCKET_NAME/zz_dev_credcheck/probe.txt")"

      - name: Catalog tokens
        run: |
          set -u
          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "::notice title=$1::expected $2 -> $3"; }
          base="${STORAGE_LAKEHOUSE_CATALOG_URL%/}"
          for kind in WRITE READ; do
            var="STORAGE_LAKEHOUSE_CATALOG_${kind}_TOKEN"; tok="${!var}"
            code=$(curl -s -o /tmp/c.json -w '%{http_code}' -H "Authorization: Bearer $tok" "$base/v1/config?warehouse=$STORAGE_LAKEHOUSE_CATALOG_NAME")
            prefix=$(jq -r '.overrides.prefix // .defaults.prefix // empty' /tmp/c.json)
            row "catalog $kind: config" 200 "$code"
            code=$(curl -s -o /tmp/n.json -w '%{http_code}' -H "Authorization: Bearer $tok" "$base/v1/${prefix:+$prefix/}namespaces")
            row "catalog $kind: list namespaces" 200 "$code $(jq -r '[.namespaces[]?[0]] | join(", ")' /tmp/n.json 2>/dev/null)"
          done

      - name: Org bot app
        id: bot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.ORG_BOT_CLIENT_ID }}  # the app's Client ID (organisation variable)
          private-key: ${{ secrets.ORG_BOT_PRIVATE_KEY }}
          owner: zohelo

      - name: Org bot and sources
        env:
          BOT_OUTCOME: ${{ steps.bot.outcome }}
          BOT_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -u
          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "::notice title=$1::expected $2 -> $3"; }
          repos=""
          if [ "$BOT_OUTCOME" = success ]; then
            repos=$(curl -s -H "Authorization: Bearer $BOT_TOKEN" https://api.github.com/installation/repositories | jq -r '[.repositories[]?.name] | join(", ")')
          fi
          row "org bot: installation token" success "$BOT_OUTCOME ${repos:+(repos: $repos)}"
          n=$(echo "$PORTAL_SIGNIN_ALLOWED_EMAILS" | tr ',' '\n' | grep -c '@' || true)
          row "portal allowed emails" "≥1 address" "$n address(es)"
          code=$(curl -s -D /tmp/h.txt -o /dev/null -w '%{http_code}' -H "X-ClientId: $SOURCE_GUS_BDL_API_KEY" "https://bdl.stat.gov.pl/api/v1/subjects?format=json&page-size=1")
          limits=$(grep -i '^x-rate-limit-limit' /tmp/h.txt | head -3 | tr -d '\r' | cut -d' ' -f2 | paste -sd/ -)
          row "GUS BDL API key" "200, higher registered limits" "$code limits ${limits:-n/a}"
          row "GUS BDL web login/password" "set" "lengths ${#SOURCE_GUS_BDL_WEB_LOGIN}/${#SOURCE_GUS_BDL_WEB_PASSWORD} (checked by the zohelo-data source run)"
