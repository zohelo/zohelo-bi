name: Screen reader

# Real screen-reader runs on the zohelo design template pages: NVDA with Chromium on Windows and
# VoiceOver with WebKit on macOS, driven by Guidepup. The pages are served locally on the runner
# (no secrets, no access to the Cloudflare-protected preview). Every run uploads the spoken
# transcripts so a person can read exactly what was announced.
#
# Mandatory to run, not yet a required check: screen-reader automation can be flaky on hosted
# runners, so failures are reported (red run + transcripts) but do not block merges until the
# flows have been stable for two weeks.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/portal/public/mockups/**"
      - "apps/portal/src/**"
      - "packages/visuals/**"
      - "tests/screen-reader/**"
  push:
    branches:
      - "design/**"
      - "template"
    paths:
      - "apps/portal/public/mockups/**"
      - "apps/portal/src/**"
      - "packages/**"
      - "tests/screen-reader/**"

permissions:
  contents: read

concurrency:
  group: screen-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen-reader:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nvda
            os: windows-2025
          - name: voiceover
            os: macos-15
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tests/screen-reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Build the template portal on sample data
        working-directory: .
        env:
          VITE_DATA_MODE: dummy
        run: bun install --frozen-lockfile && bun run build
      # Order follows Guidepup's own CI: configure the OS first, then dependencies, then the
      # screen-reader assets.
      - name: Configure OS for screen-reader automation
        run: npx -y @guidepup/setup@0.29.3 setup --ci
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Install browser
        run: npx playwright install ${{ matrix.name == 'voiceover' && 'webkit' || 'chromium' }}
      - name: Install screen reader
        run: npx guidepup install
      - name: Run flows
        run: npm run ${{ matrix.name }}
      - name: Upload transcripts and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-reader-${{ matrix.name }}
          path: |
            tests/screen-reader/results/
            tests/screen-reader/report/
          retention-days: 30
