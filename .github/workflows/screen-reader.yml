name: Screen reader

# Real screen-reader runs on the zohelo design template pages: NVDA with Chrome on Windows and
# VoiceOver with WebKit on macOS, driven by Guidepup. The pages are served locally on the runner
# (no secrets, no access to the Cloudflare-protected preview). Every run uploads the spoken
# transcripts so a person can read exactly what was announced.
#
# Mandatory to run, not yet a required check: screen-reader automation can be flaky on hosted
# runners, so failures are reported (red run + transcripts) but do not block merges until the
# flows have been stable for two weeks.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/portal/public/mockups/**"
      - "apps/portal/src/**"
      - "packages/visuals/**"
      - "tests/screen-reader/**"
  push:
    branches:
      - "design/**"
    paths:
      - "apps/portal/public/mockups/**"
      - "tests/screen-reader/**"

permissions:
  contents: read

concurrency:
  group: screen-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screen-reader:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nvda
            os: windows-2025
          - name: voiceover
            os: macos-15
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tests/screen-reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Set up screen reader
        run: npx guidepup setup --ci
      - name: Install WebKit
        if: matrix.name == 'voiceover'
        run: npx playwright install webkit
      - name: Run flows
        run: npm run ${{ matrix.name }}
      - name: Upload transcripts and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-reader-${{ matrix.name }}
          path: |
            tests/screen-reader/results/
            tests/screen-reader/report/
          retention-days: 30
