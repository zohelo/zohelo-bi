    chart: ranking
    view: rows=geography_name&cols=date_key&geography_level=wojewodztwo

  - title_pl: Mapa stopy bezrobocia rejestrowanego (GUS, koniec roku)
    title_en: Registered unemployment rate map (GUS, end of year)
    kpi_key: registered_unemployment_rate
    chart: map
    view: rows=geography_name&cols=date_key&geography_level=wojewodztwo

  - title_pl: Przeciętne wynagrodzenie brutto według województw (GUS, zł, nominalne)
