schema: 2
id: poland-overview
title_pl: Polska w danych
title_en: Poland in data
domain_key: economy
slicers: [period]
tiles:
  - title_pl: "Inflacja HICP r/r, Polska (cel NBP dla CPI: 2,5 % ± 1 p.p.)"
    title_en: "HICP inflation y/y, Poland (NBP CPI target: 2.5% ± 1 pp)"
    note_pl: HICP to miara porównywalna w UE; inflacja CPI GUS może różnić się o kilka dziesiątych punktu.
    note_en: HICP is the EU-comparable measure; GUS CPI can differ by a few tenths of a point.
    kpi_key: inflation
    chart: line
    view: rows=source_system&cols=date_key&geography_name=Polska&source_system=eurostat

  - title_pl: "Inflacja HICP r/r: Polska, Czechy, Węgry, Niemcy"
    title_en: "HICP inflation y/y: Poland, Czechia, Hungary, Germany"
    kpi_key: inflation
    chart: line
    view: rows=geography_name&cols=date_key&geography_level=country&source_system=eurostat&geography_name=Polska|Czechia|Hungary|Germany

  - title_pl: Stopa bezrobocia (BAEL), Polska i sąsiedzi
    title_en: Unemployment rate (LFS), Poland and neighbours
    kpi_key: unemployment_rate
    chart: line
    view: rows=geography_name&cols=date_key&geography_level=country&source_system=eurostat&frequency=A&geography_name=Polska|Germany|Czechia|Slovak Republic|Lithuania

  - title_pl: "Kursy NBP (tabela A): EUR, USD"
    title_en: "NBP rates (table A): EUR, USD"
    kpi_key: fx_rate
    chart: line
    view: 'rows=breakdown_json&cols=date_key&breakdown_json={"currency":"EUR"}|{"currency":"USD"}'

  - title_pl: Ludność Polski wg źródeł (różne daty odniesienia)
    title_en: Population of Poland by source (different reference dates)
    kpi_key: population
    chart: line
    view: rows=source_system&cols=date_key&geography_level=country&geography_name=Polska

  - title_pl: Ludność według województw (GUS)
    title_en: Population by voivodeship (GUS)
    kpi_key: population
    chart: bar
    selects: true
    view: rows=geography_name&cols=date_key&geography_level=wojewodztwo&source_system=gus_dbw

  - title_pl: "$selected: ludność"
    title_en: "$selected: population"
    title_unselected_pl: Ludność województwa
    title_unselected_en: Voivodeship population
    kpi_key: population
    chart: line
    view: rows=source_system&cols=date_key&geography_level=wojewodztwo&geography_name=$selected
